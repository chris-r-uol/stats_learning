name: Verify answers

# An answer-checking site whose answers are wrong is worse than no site, so
# this gates every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Recompute every answer key
        run: python tools/verify_answers.py

      - name: Evaluate the workbench formulas
        run: python tools/check_workbench.py

      # Compares cell contents rather than bytes: an .xlsx is a ZIP carrying
      # timestamps, so two builds of identical content never match byte for byte.
      - name: Check the workbooks are in step with the data
        run: python tools/build_workbooks.py --check
