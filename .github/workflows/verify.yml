name: Verify answers

# An answer-checking site whose answers are wrong is worse than no site, so
# this gates every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install numpy scipy openpyxl pyyaml

      - name: Recompute every answer key
        run: python tools/verify_answers.py

      - name: Evaluate the workbench formulas
        run: python tools/check_workbench.py

      - name: Check the workbooks are in step with the data
        run: |
          python tools/build_workbooks.py
          if ! git diff --quiet -- data/xlsx workbooks; then
            echo "::error::The committed workbooks do not match the committed CSVs."
            echo "Run 'python tools/build_workbooks.py' and commit the result."
            git diff --stat -- data/xlsx workbooks
            exit 1
          fi
