<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1096 134" role="img" aria-label="Method for hypothesis testing">
<title>Method for hypothesis testing</title>
<rect x="4" y="4" width="168" height="88" rx="10" fill="#1f4e5f"/>
<text x="88" y="32" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">State the null and</text>
<text x="88" y="48" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">alternative</text>
<text x="88" y="64" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">hypothesis</text>
<rect x="188" y="4" width="168" height="88" rx="10" fill="#1f4e5f"/>
<text x="272" y="32" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">Identify the</text>
<text x="272" y="48" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">important</text>
<text x="272" y="64" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">information</text>
<rect x="372" y="4" width="168" height="88" rx="10" fill="#1f4e5f"/>
<text x="456" y="40" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">Choose a</text>
<text x="456" y="56" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">significance level</text>
<rect x="556" y="4" width="168" height="88" rx="10" fill="#1f4e5f"/>
<text x="640" y="40" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">Choose and calculate</text>
<text x="640" y="56" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">a test statistic</text>
<rect x="740" y="4" width="168" height="88" rx="10" fill="#1f4e5f"/>
<text x="824" y="32" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">Calculate the</text>
<text x="824" y="48" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">critical value and</text>
<text x="824" y="64" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">p-value</text>
<rect x="924" y="4" width="168" height="88" rx="10" fill="#1f4e5f"/>
<text x="1008" y="40" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">Interpret your</text>
<text x="1008" y="56" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">results</text>
<line x1="6" y1="110" x2="1078" y2="110" stroke="#1f4e5f" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
<path d="M 1074,102 L 1090,110 L 1074,118 Z" fill="#1f4e5f" fill-opacity="0.45"/>
</svg>