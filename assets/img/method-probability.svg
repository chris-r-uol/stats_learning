<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 134" role="img" aria-label="Method for evaluating probability intervals">
<title>Method for evaluating probability intervals</title>
<rect x="4" y="4" width="168" height="88" rx="10" fill="#1f4e5f"/>
<text x="88" y="32" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">Identify the</text>
<text x="88" y="48" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">information in the</text>
<text x="88" y="64" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">question</text>
<rect x="188" y="4" width="168" height="88" rx="10" fill="#1f4e5f"/>
<text x="272" y="40" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">Identify the</text>
<text x="272" y="56" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">probability function</text>
<rect x="372" y="4" width="168" height="88" rx="10" fill="#1f4e5f"/>
<text x="456" y="32" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">Identify the</text>
<text x="456" y="48" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">probability interval</text>
<text x="456" y="64" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">for evaluation</text>
<rect x="556" y="4" width="168" height="88" rx="10" fill="#1f4e5f"/>
<text x="640" y="32" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">Rearrange the</text>
<text x="640" y="48" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">probability so it</text>
<text x="640" y="64" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">fits what you have</text>
<rect x="740" y="4" width="168" height="88" rx="10" fill="#1f4e5f"/>
<text x="824" y="40" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">Comment on the</text>
<text x="824" y="56" text-anchor="middle" font-size="13" fill="#ffffff" font-family="system-ui, sans-serif">result</text>
<line x1="6" y1="110" x2="894" y2="110" stroke="#1f4e5f" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
<path d="M 890,102 L 906,110 L 890,118 Z" fill="#1f4e5f" fill-opacity="0.45"/>
</svg>