tutorial: 4
title: Hypothesis Testing

intro: |
  A hypothesis test answers one question: did something really change, or is
  this just random variation? Tutorial 5 uses these methods throughout.

learning_outcomes:
  - Explain hypothesis testing including null and alternative hypotheses, p-values, and Type 1 and Type 2 errors.
  - Perform and interpret one-sample hypothesis tests for a population mean.
  - Compare two groups using independent and paired sample tests.

datasets:
  - id: junction
    name: Junction waiting times
    csv: junction-waiting.csv
    sheet: T4 Junction Waiting

supplementary: |
  ![The six steps of the hypothesis testing method](assets/img/method-hypothesis.svg)

  ### Excel has no single function for this

  `T.TEST` needs two ranges of raw data, and so does the Analysis ToolPak.
  Questions 3 and 4 give you only n, the mean and the standard deviation. **No
  Excel function accepts summary statistics.** You must build the test from
  separate cell formulas.

  The [**Hypothesis Test Workbench**](workbooks/hypothesis-test-workbench.xlsx)
  does this for you. It has one sheet per test, yellow cells for your inputs,
  and both routes to the answer side by side. Download it before you start.

  When it opens, click **Enable Editing** in the yellow bar at the top. Excel
  opens downloaded files read-only, so until you do, typing into the input
  cells has no effect.

  ### Which test?

  | Situation | Test |
  |---|---|
  | One sample against a known population mean, σ **known** | One-sample z |
  | One sample against a known population mean, σ **unknown** | One-sample t |
  | Two independent groups, σ known or both samples large | Two-sample z |
  | Two independent groups, σ unknown | Two-sample t |
  | Same subjects measured twice | **Paired** t |
  | Two categorical variables | Chi-squared |
  | More than two independent groups | ANOVA |

  ### Two routes to the same answer

  Each question asks for **both** the critical value and the p-value. They give
  the same result, so you can use one to check the other.

  - **Critical value:** reject H₀ if the test statistic is further from zero
    than the critical value.
  - **p-value:** reject H₀ if p < α.

questions:

  # ----------------------------------------------------------- Question 1
  - id: t4-q1
    title: Question 1 — Stating hypotheses
    prompt: |
      For each statement, choose a null and an alternative hypothesis.

      **H₀ always states that nothing has changed.** You assume there is no
      effect until the data gives you reason to think otherwise.

      *Example:* "In the US there are 1.9 vehicles per household" gives
      H₀: μ = 1.9 and H₁: μ ≠ 1.9. Here μ is the mean number of vehicles per
      household.
    steps:
      - kind: hypothesis
        ask: "The arrival time of public transport is within 5 minutes of its scheduled time."
        parts:
          - key: h0
            label: Null hypothesis
            options:
              - value: "μ_arrival = μ_schedule ± 5"
                correct: true
              - value: "μ_arrival ≠ μ_schedule ± 5"
                feedback: |
                  This is the alternative. H₀ states that there is no
                  difference: services run within the stated limit.
              - value: "μ_arrival > μ_schedule"
                feedback: |
                  The statement is about being *within* 5 minutes, in either
                  direction. It is not only about running late.
          - key: tails
            label: Test type
            options:
              - value: Two-tailed
                correct: true
              - value: One-tailed
                feedback: |
                  A service can be early or late. The statement does not choose
                  a direction, so use a two-tailed test.

      - kind: hypothesis
        ask: "The average fuel consumption of hybrid vehicles is the same as for internal-combustion vehicles."
        parts:
          - key: h0
            label: Null hypothesis
            options:
              - value: "μ_hybrid = μ_ice"
                correct: true
              - value: "μ_hybrid < μ_ice"
                feedback: |
                  This is an alternative hypothesis with a direction. H₀ states
                  that the two means are equal.
              - value: "μ_hybrid ≠ μ_ice"
                feedback: |
                  This is H₁. H₀ states that the two means are the same.
          - key: tails
            label: Test type
            options:
              - value: Two-tailed
                correct: true
              - value: One-tailed
                feedback: |
                  The statement asks whether the two are "the same". It does not
                  choose a direction, so a difference either way matters. Use a
                  two-tailed test.

      - kind: hypothesis
        ask: "Reducing the motorway speed limit from 70 mph to 50 mph reduces accident frequency."
        parts:
          - key: h0
            label: Null hypothesis
            options:
              - value: "μ_50 = μ_70"
                correct: true
              - value: "μ_50 < μ_70"
                feedback: |
                  This is the alternative. It is the claim being tested. H₀ must
                  state that the speed limit made no difference.
          - key: h1
            label: Alternative hypothesis
            options:
              - value: "μ_50 < μ_70  (one-tailed)"
                correct: true
              - value: "μ_50 ≠ μ_70  (two-tailed)"
                feedback: |
                  This is not wrong. But the statement claims a direction: the
                  lower limit *reduces* accidents. A one-tailed test matches
                  that claim and detects it more easily.
              - value: "μ_50 > μ_70"
                feedback: |
                  This is the wrong direction. The claim is that the lower speed
                  limit reduces accidents.
        solution:
          working: |
            Only this statement has a direction, and it shows the trade-off.

            A one-tailed test detects an effect more easily in the direction you
            choose. It cannot detect an effect in the other direction. If the
            lower speed limit increased accidents, a one-tailed test would fail
            to reject H₀ and you would not find out.

            **Choose the direction before you look at the data.** Choosing
            one-tailed after seeing the result is a way of creating false
            significance.

  # ----------------------------------------------------------- Question 2
  - id: t4-q2
    title: Question 2 — Type 1 and Type 2 errors
    prompt: |
      For each statement in Question 1, state the Type 1 and Type 2 errors.

      *Example (vehicles per household):*

      - **Type 1:** we REJECT H₀ when it is true. We conclude the mean is not
        1.9 when it is.
      - **Type 2:** we DO NOT REJECT H₀ when it is false. We conclude the mean
        is 1.9 when it is not.
    steps:
      - kind: choice
        prose: true
        ask: Which describes a Type 1 error?
        options:
          - value: Rejecting the null hypothesis when it is actually true
            correct: true
            feedback: |
              Correct. This is a false alarm. You report an effect that does not
              exist. The significance level α is the probability of this
              happening. At α = 0.05 you accept a 5% risk.
          - value: Failing to reject the null hypothesis when it is actually false
            feedback: |
              This is a Type 2 error, a missed effect. A Type 1 error is the
              opposite: reporting an effect that does not exist.
          - value: Choosing the wrong statistical test
            feedback: |
              This is a mistake, but not a Type 1 error. Type 1 and Type 2
              errors describe a wrong conclusion from a correct method.
          - value: Using the wrong significance level
            feedback: |
              The significance level is a choice, not an error. α sets the
              probability of a Type 1 error.

      - kind: choice
        prose: true
        ask: |
          For the speed limit study, H₀ states that the change to 50 mph made no
          difference to accident frequency. Which is the Type 2 error?
        options:
          - value: We conclude the speed limit made no difference, when in reality it reduced accidents
            correct: true
            feedback: |
              Correct. A real safety benefit exists, and the study does not find
              it. The consequence is that a measure that works is removed.
          - value: We conclude the speed limit reduced accidents, when in reality it made no difference
            feedback: |
              This is the Type 1 error, a false positive. A Type 2 error is
              failing to detect a real effect.
          - value: We conclude the speed limit increased accidents
            feedback: |
              This is neither error type. Type 1 and Type 2 depend only on
              whether you rejected H₀ and whether H₀ was true.
          - value: The sample was too small to detect the effect
            feedback: |
              A small sample makes a Type 2 error more likely. It is a cause,
              not the error. The error is the wrong conclusion.

      - kind: choice
        prose: true
        ask: |
          You reduce α from 0.05 to 0.01 and change nothing else. What happens to
          the two error rates?
        options:
          - value: Type 1 errors become less likely, Type 2 errors more likely
            correct: true
            feedback: |
              Correct. Requiring stronger evidence means you report fewer
              effects that do not exist, and miss more that do. To reduce both
              at once, collect more data.
          - value: Both become less likely
            feedback: |
              With a fixed sample size, the two work against each other. Making
              H₀ harder to reject reduces false positives and increases missed
              effects.
          - value: Type 1 errors become more likely, Type 2 errors less likely
            feedback: |
              A smaller α requires stronger evidence to reject H₀. False
              positives become rarer, and missed effects more common.
          - value: Neither changes
            feedback: |
              α is the Type 1 error rate. Changing it changes that rate, and
              moves the Type 2 rate the other way.

      - kind: freetext
        ask: |
          For the hybrid fuel consumption study, write both error types as full
          sentences. Then say which would concern you more if you were advising
          a transport authority about buying vehicles.
        min_length: 100
        rubric:
          - States the Type 1 error. Concluding the two differ when they do not.
          - States the Type 2 error. Concluding the two are the same when they differ.
          - Says which matters more here, and gives a reason based on the consequences.
          - Uses full sentences that a non-specialist can follow.
        solution:
          working: |
            **Model answer.** A Type 1 error would mean concluding that hybrid
            and internal-combustion vehicles use different amounts of fuel when
            they do not. The authority might then spend a large sum replacing
            its fleet for a saving that never appears. A Type 2 error would mean
            concluding that the two are the same when hybrids really do use less
            fuel. The authority would then miss a chance to cut fuel costs and
            emissions.

            Which error matters more depends on the cost of the decision.
            Replacing a fleet is expensive and hard to reverse, so I would be
            more concerned about the Type 1 error. I would also check that the
            study was large enough to detect a real difference, because a Type 2
            error from a small study looks like evidence of no difference.
          note: |
            The last part has no single correct answer. Link your choice to the
            consequences of each error.

  # ----------------------------------------------------------- Question 3
  - id: t4-q3
    title: Question 3 — One-sample z-test
    prompt: |
      Years of data show that delays on the Cross Country Express line have a
      **population standard deviation of 3.5 minutes**. The average delay has
      been **12 minutes**.

      After a signalling upgrade, the rail authority measures **100 journeys**.
      The sample mean is **10.9 minutes**.

      Using α = 0.05, is there enough evidence that the upgrade reduced the
      average delay?
    note: |
      Work through the calculation by hand. Then check it on the **One-Sample Z**
      sheet of the workbench.
    steps:
      - kind: hypothesis
        ask: Set up the test.
        parts:
          - key: h0
            label: Null hypothesis
            options:
              - value: "μ = 12"
                correct: true
              - value: "μ = 10.9"
                feedback: |
                  10.9 is the sample mean, the value you measured. H₀ describes
                  the population. It states that the delay is still 12 minutes.
              - value: "μ < 12"
                feedback: |
                  This is the alternative hypothesis. H₀ states no change, using
                  an equals sign.
          - key: h1
            label: Alternative hypothesis
            options:
              - value: "μ < 12"
                correct: true
              - value: "μ ≠ 12"
                feedback: |
                  This is not wrong, but the question asks whether the delay has
                  *decreased*. That is a direction, so use a one-tailed
                  alternative.
              - value: "μ > 12"
                feedback: |
                  This is the wrong direction. The question asks whether delays
                  became shorter.
          - key: test
            label: Which test
            options:
              - value: One-sample z-test
                correct: true
              - value: One-sample t-test
                feedback: |
                  Use t when you estimate the standard deviation from the
                  sample. Here the population standard deviation is given as
                  3.5, so use z.
              - value: Two-sample z-test
                feedback: |
                  There is one sample of 100 journeys, compared with a known
                  historical value. There is no second sample.
              - value: Paired t-test
                feedback: |
                  A paired test needs the same subjects measured twice. These
                  are 100 new journeys, not the same journeys before and after.
        hints:
          - Do you know the population standard deviation, or are you estimating it from the sample?

      - kind: numeric
        ask: What is the standard error?
        answer: 0.35
        tol: {abs: 0.005}
        verify: 3.5 / math.sqrt(100)
        traps:
          - value: 3.5
            feedback: |
              This is the population standard deviation. Divide it by √n:
              3.5 ÷ 10.
          - value: 0.035
            tol: {abs: 0.005}
            feedback: |
              You have divided by n, which is 100. Divide by √n, which is 10.

      - kind: numeric
        ask: What is the z test statistic?
        answer: -3.14
        tol: {abs: 0.02}
        verify: (10.9 - 12) / (3.5 / math.sqrt(100))
        traps:
          - value: -0.314
            tol: {abs: 0.02}
            feedback: |
              You have divided by 3.5. Divide by the standard error, 0.35.
        hints:
          - "z = (sample mean − population mean) ÷ standard error."
        solution:
          working: |
            z = (10.9 − 12) ÷ (3.5 ÷ 10) = −1.1 ÷ 0.35 = **−3.14**

            Keep the minus sign. It shows the new mean is below the old one,
            which is the direction the upgrade was meant to produce.

      - kind: numeric
        ask: What is the p-value?
        answer: 0.00084
        tol: {abs: 0.0002}
        precision: Give your answer to 4 decimal places, or in scientific notation.
        verify: NORM_S_DIST(-3.14, True)
        traps:
          - value: 0.9992
            tol: {abs: 0.001}
            feedback: |
              This is the area to the *right* of your z-score. This is a
              left-tailed test, so use the negative z directly to get the left
              area.
          - value: 0.0017
            tol: {abs: 0.0003}
            feedback: |
              You have doubled the tail area, which a two-tailed test needs.
              This test has one direction, so use a single tail.
        solution:
          excel: "=NORM.S.DIST(-3.14,TRUE)"
          r: "pnorm(-3.14)"
          python: "scipy.stats.norm.cdf(-3.14)"
          note: |
            `NORM.S.DIST` needs the second argument. Without `TRUE` it returns
            the height of the curve, which is not a p-value.

      - kind: decision
        ask: What do you conclude at α = 0.05?
        answer: reject
        reasons:
          - value: p = 0.0008 is less than α = 0.05
            correct: true
          - value: The z-score is negative
            feedback: |
              A negative z shows the direction of the difference, not its size.
              A z of −0.2 is also negative but not significant.
          - value: The sample mean (10.9) is lower than 12
            feedback: |
              This is the observation that led to the test. Any sample of 100
              journeys would differ from 12 by some amount. The test decides
              whether that difference is larger than chance would produce.
        solution:
          working: |
            p = 0.0008, which is well below α = 0.05, so **reject H₀**.

            The critical value route gives the same result. The critical z for a
            one-tailed test at α = 0.05 is −1.645, and −3.14 is beyond it.

            **In plain language:** there is strong evidence that the signalling
            upgrade reduced average delays. If nothing had changed, a fall this
            large would occur less than once in a thousand studies.

  # ----------------------------------------------------------- Question 4
  - id: t4-q4
    title: Question 4 — Comparing two independent samples
    prompt: |
      A study of train reliability on the Leeds–Ilkley line in **2016** measured
      **50 trains**. The mean lateness was **3.9 minutes**, with a standard
      deviation of **2.1 minutes**.

      A second study in **2017** measured **40 trains**. The mean lateness was
      **4.8 minutes**, with a standard deviation of **1.9 minutes**.

      Is this evidence of a significant change in lateness?

      | | Mean | SD | n |
      |---|---|---|---|
      | 2016 | 3.9 | 2.1 | 50 |
      | 2017 | 4.8 | 1.9 | 40 |
    note: |
      Use the **Two-Sample Z** sheet of the workbench. The question gives no
      significance level, so choose one and state it. Use 95%, so α = 0.05.
    steps:
      - kind: hypothesis
        ask: Set up the test.
        parts:
          - key: h1
            label: Alternative hypothesis
            options:
              - value: "μ₁ ≠ μ₂"
                correct: true
              - value: "μ₁ < μ₂"
                feedback: |
                  The question asks about a "change" and gives no direction. A
                  difference either way matters, so use a two-tailed test.
              - value: "μ₁ = μ₂"
                feedback: |
                  This is H₀. The alternative is what you conclude if the
                  evidence is strong enough to reject H₀.
          - key: paired
            label: Paired or independent?
            options:
              - value: Independent samples
                correct: true
              - value: Paired samples
                feedback: |
                  A paired test needs each value in one group matched to a value
                  in the other. These are two separate groups of different
                  sizes, 50 trains and 40 different trains. The different sizes
                  show they cannot be paired.
        hints:
          - Can you match train 1 in 2016 to train 1 in 2017? What do the different sample sizes tell you?

      - kind: numeric
        ask: What is the standard error of the difference between the means?
        answer: 0.422
        tol: {abs: 0.005}
        verify: math.sqrt(2.1**2 / 50 + 1.9**2 / 40)
        traps:
          - value: 0.2
            tol: {abs: 0.01}
            feedback: |
              You have subtracted the standard deviations. Combine them with
              their squares: √(s₁²/n₁ + s₂²/n₂).
          - value: 4.0
            tol: {abs: 0.05}
            feedback: |
              You have added the standard deviations. Divide each variance by
              its sample size, add the results, then take the square root.
        hints:
          - "s = √(s₁²/n₁ + s₂²/n₂)"
        solution:
          working: |
            s = √(2.1²/50 + 1.9²/40) = √(0.0882 + 0.09025) = √0.17845 = **0.422**

      - kind: numeric
        ask: What is the z test statistic?
        answer: 2.13
        also_accept: [-2.13]
        tol: {abs: 0.02}
        verify: (4.8 - 3.9) / math.sqrt(2.1**2 / 50 + 1.9**2 / 40)
        solution:
          working: |
            z = (4.8 − 3.9) ÷ 0.422 = 0.9 ÷ 0.422 = **2.13**

            The sign depends on which mean you subtract from which. For a
            two-tailed test, only the size matters.

      - kind: numeric
        ask: What is the critical z value at α = 0.05?
        answer: 1.96
        tol: {abs: 0.01}
        verify: NORM_S_INV(0.975)
        traps:
          - value: 1.645
            tol: {abs: 0.01}
            feedback: |
              This is the one-tailed value. This test is two-tailed, so α is
              divided between the tails. Use `NORM.S.INV(0.975)`, which gives
              1.96.
        hints:
          - In a two-tailed test each tail holds α/2 = 0.025.

      - kind: numeric
        ask: What is the p-value?
        answer: 0.033
        tol: {abs: 0.002}
        verify: 2 * (1 - NORM_S_DIST(2.1305))
        traps:
          - value: 0.0166
            tol: {abs: 0.002}
            feedback: |
              This is the one-tailed p-value. Double it for a two-tailed test,
              because a difference this large in either direction counts as
              evidence against H₀.
          - value: 0.9834
            tol: {abs: 0.002}
            feedback: |
              This is the area to the left of your z. The p-value is the
              probability of a result at least this extreme, so use the tail
              areas.
        solution:
          excel: "=2*(1-NORM.S.DIST(2.13,TRUE))"
          r: "2 * pnorm(2.13, lower.tail = FALSE)"
          python: "2 * scipy.stats.norm.sf(2.13)"

      - kind: decision
        ask: What do you conclude?
        answer: reject
        reasons:
          - value: p = 0.033 is less than α = 0.05, and |z| = 2.13 exceeds 1.96
            correct: true
          - value: The 2017 mean is higher than the 2016 mean
            feedback: |
              Two samples almost always have different means. The test decides
              whether the difference is larger than sampling variation would
              produce.
          - value: The samples are large enough for the central limit theorem
            feedback: |
              This allows you to use a z-test. It is not the reason for the
              decision. The decision comes from comparing the statistic with the
              critical value, or p with α.
        solution:
          working: |
            |z| = 2.13 > 1.96, and p = 0.033 < 0.05, so **reject H₀**.

            Lateness on the Leeds–Ilkley line changed significantly between 2016
            and 2017. It became worse, by about 0.9 minutes on average.

            Note that p = 0.033 is only a little below 0.05. This is real
            evidence, but it is much weaker than the 0.0008 in Question 3. Read
            a p-value as a quantity, not only as pass or fail.
          note: |
            This question uses a **z**-test, although the population standard
            deviations are unknown and estimated from the samples. This is
            acceptable at n = 50 and 40, because the central limit theorem
            applies. A two-sample **t**-test is the more usual choice when you
            estimate the spread.

            Try the Two-Sample T sheet of the workbench. With 88 degrees of
            freedom the critical value is 1.987 instead of 1.96, and the
            conclusion does not change. A t-test here is also correct.

  # ----------------------------------------------------------- Question 5
  - id: t4-q5
    title: Question 5 — Paired samples
    dataset_label: T4 Junction Waiting
    prompt: |
      Waiting time at a junction was measured **before and after** a development
      project. The data is on the **T4 Junction Waiting** sheet. Decide whether
      the waiting time changed significantly.

      This question gives you the raw data, so you can check your answer a
      second way.
    note: |
      Each row is the same location measured twice, so the data is paired. Start
      by adding a column of differences.
    steps:
      - kind: choice
        ask: Why is a paired test the right choice here?
        prose: true
        options:
          - value: Each "before" value is matched to a specific "after" value
            correct: true
            feedback: |
              Correct. Pairing removes the variation between locations and
              measures the change at each one. This makes the test more
              sensitive. Treating the data as independent would lose that
              advantage.
          - value: The two samples are the same size
            feedback: |
              Paired samples are always the same size, but two unrelated samples
              can be too. What matters is that each pair is the same location.
          - value: The data is normally distributed
            feedback: |
              A paired t-test does assume the differences are roughly normal.
              That is a condition for the test to be valid, not the reason for
              choosing it. The reason is the matching.
          - value: There are more than 30 observations
            feedback: |
              Sample size affects which distribution you can use. It does not
              decide whether the data is paired.

      - kind: numeric
        ask: What is the mean of the differences (after − before)?
        answer: -8.4
        tol: {abs: 0.05}
        unit: seconds
        verify: float(junction_diff.mean())
        traps:
          - value: 8.4
            tol: {abs: 0.05}
            feedback: |
              The size is correct but the sign is wrong. "After − before" gives
              a negative value, which means waiting times fell. Either order
              works, as long as you keep it consistent and read the sign
              correctly at the end.
        solution:
          excel: "=AVERAGE(D2:D31)   where column D is =C2-B2 copied down"
          r: "mean(after - before)"
          python: "(df.after_s - df.before_s).mean()"

      - kind: numeric
        ask: What is the standard deviation of the differences?
        answer: 4.99
        tol: {abs: 0.05}
        unit: seconds
        verify: stdev_s(junction_diff)
        traps:
          - value: 9.0
            tol: {abs: 1.5}
            feedback: |
              This is the standard deviation of one of the original columns. A
              paired test uses the difference column only. Create that column
              first, then summarise it.
        hints:
          - "Use STDEV.S on the difference column, not on the before or after columns."

      - kind: numeric
        ask: What is the t test statistic?
        answer: -9.22
        tol: {abs: 0.06}
        verify: float(junction_diff.mean() / (stdev_s(junction_diff) / math.sqrt(30)))
        traps:
          - value: -1.68
            tol: {abs: 0.1}
            feedback: |
              You have divided by the standard deviation. Divide 4.99 by √30
              first to get the standard error, then divide by that.
        hints:
          - "t = mean difference ÷ (standard deviation of differences ÷ √n)."
        solution:
          working: |
            t = −8.4 ÷ (4.99 ÷ √30) = −8.4 ÷ 0.911 = **−9.22**

            This is a very large test statistic. Values beyond about ±3 are
            already unusual. A value of −9.2 means the change is about nine
            standard errors away from no change.

      - kind: numeric
        ask: How many degrees of freedom?
        answer: 29
        tol: {abs: 0}
        verify: 30 - 1
        traps:
          - value: 30
            feedback: |
              A paired test has n − 1 degrees of freedom, where n is the number
              of pairs.
          - value: 58
            feedback: |
              This is n₁ + n₂ − 2, the formula for an independent two-sample
              test. A paired test uses one column of 30 differences, so df = 29.

      - kind: numeric
        ask: What is the critical t value at α = 0.05, two-tailed?
        answer: 2.045
        tol: {abs: 0.005}
        verify: T_INV_2T(0.05, 29)
        traps:
          - value: 1.699
            tol: {abs: 0.005}
            feedback: |
              This is `T.INV(0.95, 29)`, the one-tailed value. For a two-tailed
              test use `T.INV.2T(0.05, 29)`, or `T.INV(0.975, 29)`.
          - value: 2.462
            tol: {abs: 0.01}
            feedback: |
              You have divided α by 2 and also used the two-tailed function, so
              α has been halved twice. `T.INV.2T` takes the full α. Enter 0.05,
              not 0.025.
        solution:
          excel: "=T.INV.2T(0.05,29)"
          r: "qt(0.975, df = 29)"
          python: "scipy.stats.t.ppf(0.975, 29)"
          note: |
            These two functions are easy to confuse.

            `T.INV.2T(α, df)` takes the **full** α and divides it between the
            tails for you.

            `T.INV(p, df)` measures from the left only. For a two-tailed test,
            pass 1 − α/2.

            `T.INV.2T(0.05, 29)` and `T.INV(0.975, 29)` give the same value.
            `T.INV(0.95, 29)` does not.

      - kind: choice
        ask: Which is closest to the p-value?
        options:
          - value: "4 × 10⁻¹⁰"
            correct: true
            feedback: |
              Correct. If the development had made no difference, a change this
              large would appear about once in two and a half billion studies.
          - value: "0.04"
            feedback: |
              Too large. A t of −9.2 with 29 degrees of freedom is far more
              extreme. A p-value of 0.04 matches a t of about −2.1.
          - value: "0.4"
            feedback: |
              A p-value of 0.4 would mean the data agrees with no change. A t of
              −9.2 does not.
          - value: "0.96"
            feedback: |
              This is close to 1 − p. The p-value is the probability of a result
              at least this extreme, so it is the small number.

      - kind: decision
        ask: What do you conclude?
        answer: reject
        reasons:
          - value: "|t| = 9.22 far exceeds the critical value of 2.045, and p is far below 0.05"
            correct: true
          - value: The waiting times are lower after the project
            feedback: |
              This is the observation. The test is what shows the fall is larger
              than random variation would produce.
          - value: The data is paired
            feedback: |
              Pairing decided which test to use. It does not give the result of
              the test.
        solution:
          working: |
            |t| = 9.22 > 2.045, and p ≈ 4 × 10⁻¹⁰ < 0.05, so **reject H₀**.

            **In plain language:** waiting times at the junction fell by about
            8.4 seconds on average after the development. A change this large is
            too big to be chance. The project improved the junction.

            ### Check the result a second way

            You have the raw data, so you can test it directly:

            `=T.TEST(before_range, after_range, 2, 1)`

            The `2` means two-tailed and the `1` means paired. This returns the
            p-value, the same 4 × 10⁻¹⁰.

            Use two methods whenever you can. A result you can reach two ways is
            more reliable than one you can reach only one way.
          excel: "=T.TEST(B2:B31,C2:C31,2,1)"
          r: "t.test(after, before, paired = TRUE)"
          python: "scipy.stats.ttest_rel(df.after_s, df.before_s)"
          note: |
            R's `t.test(..., paired = TRUE)` and Python's `ttest_rel` return the
            statistic and the p-value together. Both match the Excel result.
