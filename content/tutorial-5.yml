tutorial: 5
title: Relationships Within Data

intro: |
  The earlier tutorials looked at one variable at a time. This tutorial looks
  at pairs. Are two categories linked? Can one number predict another?

learning_outcomes:
  - Use contingency tables to calculate proportions of populations.
  - Assess the dependence or independence of sets of data using Chi-Squared tests.
  - Calculate linear regression using the least-squares method.

datasets:
  - id: taxi
    name: Taxi queue
    csv: taxi-queue.csv
    sheet: T5 Taxi Queue
  - id: cars
    name: Car ownership
    csv: car-ownership.csv
    sheet: T5 Car Ownership
  - id: accidents
    name: Accidents by weather
    csv: accidents-weather.csv
    sheet: T5 Accidents Weather
  - id: reaction
    name: Reaction distance
    csv: reaction-distance.csv
    sheet: T5 Reaction Distance

supplementary: |
  Questions 2, 3 and 4 end with a hypothesis test. Use the method from
  [Tutorial 4](tutorial.html?t=4). Once you have built the tables, the
  **Chi-Squared** and **Regression Coefficient** sheets of the
  [Hypothesis Test Workbench](workbooks/hypothesis-test-workbench.xlsx) will do
  the final comparison.

  Two rules for χ² tests, both covered below. A χ² test is **never
  two-tailed**. Every expected value must be **at least 5**.

questions:

  # ----------------------------------------------------------- Question 1
  - id: t5-q1
    title: Question 1 — Relative frequency and probability
    dataset_label: T5 Taxi Queue
    prompt: |
      The table shows the number of people in a queue at a taxi rank, and how
      often each number was observed.

      | Number in queue | 1 | 2 | 3 | 4 | 5 | 6 |
      |---|---|---|---|---|---|---|
      | Frequency | 6 | 4 | 5 | 2 | 2 | 1 |

      Relative frequency estimates probability: f&#8341; = n&#8341; ÷ N.
    steps:
      - kind: numeric
        ask: What is N, the total number of observations?
        answer: 20
        tol: {abs: 0}
        verify: 6 + 4 + 5 + 2 + 2 + 1

      - kind: table
        ask: Complete the relative frequency row.
        tol: {abs: 0.005}
        corner: "Number in queue"
        columns: ["1", "2", "3", "4", "5", "6"]
        rows: ["Relative frequency"]
        cells:
          - key: f1
            row: 0
            col: 0
            answer: 0.30
            traps:
              - value: 6
                feedback: |
                  This is the frequency. Divide it by the total, 20.
          - {key: f2, row: 0, col: 1, answer: 0.20}
          - {key: f3, row: 0, col: 2, answer: 0.25}
          - {key: f4, row: 0, col: 3, answer: 0.10}
          - {key: f5, row: 0, col: 4, answer: 0.10}
          - {key: f6, row: 0, col: 5, answer: 0.05}
        verify: "[6/20, 4/20, 5/20, 2/20, 2/20, 1/20]"
        hints:
          - Divide each count by 20. The six values must add up to 1.

      - kind: numeric
        ask: What is the probability that a queue contains fewer than four people?
        answer: 0.75
        tol: {abs: 0.005}
        verify: (6 + 4 + 5) / 20
        traps:
          - value: 0.85
            tol: {abs: 0.005}
            feedback: |
              You have included queues of exactly 4. "Fewer than four" means 1,
              2 or 3.
          - value: 0.25
            tol: {abs: 0.005}
            feedback: |
              This is the probability of four or more. The question asks for
              fewer than four.
        solution:
          working: |
            P(n < 4) = P(1) + P(2) + P(3) = 0.30 + 0.20 + 0.25 = **0.75**

      - kind: numeric
        ask: What is the probability that a queue contains more than three people?
        answer: 0.25
        tol: {abs: 0.005}
        verify: (2 + 2 + 1) / 20
        solution:
          working: |
            P(n > 3) = 1 − P(n < 4) = 1 − 0.75 = **0.25**

            You can also add 0.10 + 0.10 + 0.05. Using the complement is faster.

      - kind: numeric
        ask: |
          Two queues are observed. What is the probability that the first
          contains three people and the second contains five?
        answer: 0.025
        tol: {abs: 0.001}
        verify: (5 / 20) * (2 / 20)
        traps:
          - value: 0.35
            tol: {abs: 0.005}
            feedback: |
              You have added the two probabilities. Add for "one **or** the
              other". Multiply for "one **and** the other".
        hints:
          - The two queues are independent. For "A and B" with independent events, multiply.
        solution:
          working: |
            P(A = 3 **and** B = 5) = P(A = 3) × P(B = 5) = 0.25 × 0.10 = **0.025**

            You can multiply because the two queues are independent. The length
            of the first tells you nothing about the second.

  # ----------------------------------------------------------- Question 2
  - id: t5-q2
    title: Question 2 — Contingency tables and independence
    dataset_label: T5 Car Ownership
    prompt: |
      Complete the contingency table by adding the rows and columns.

      | | Has car | No car |
      |---|---|---|
      | Employed | 130 | 21 |
      | Unemployed | 21 | 34 |
      | Homemaker | 54 | 50 |
      | Student | 31 | 120 |
      | Retired | 31 | 53 |
      | Disability | 11 | 13 |
    steps:
      - kind: table
        ask: Give the column totals and the grand total.
        tol: {abs: 0}
        corner: "Totals"
        columns: ["Has car", "No car", "Grand total"]
        rows: ["Total"]
        cells:
          - {key: c1, row: 0, col: 0, answer: 278}
          - {key: c2, row: 0, col: 1, answer: 291}
          - key: g
            row: 0
            col: 2
            answer: 569
            traps:
              - value: 151
                feedback: |
                  This is the employed row total. The grand total adds every
                  value in the table.
        verify: "[130+21+54+31+31+11, 21+34+50+120+53+13, 569]"

      - kind: numeric
        ask: What proportion of people are students?
        answer: 0.265
        tol: {abs: 0.002}
        verify: 151 / 569
        traps:
          - value: 0.205
            tol: {abs: 0.002}
            feedback: |
              This is the proportion of students who have a car, 31 ÷ 151. The
              question asks what share of everyone is a student, so divide by
              the grand total.
        hints:
          - "The student row totals 151. Out of what total?"

      - kind: numeric
        ask: What proportion of people have a car?
        answer: 0.489
        tol: {abs: 0.002}
        verify: 278 / 569

      - kind: numeric
        ask: What proportion of students have a car?
        answer: 0.205
        tol: {abs: 0.002}
        verify: 31 / 151
        traps:
          - value: 0.0545
            tol: {abs: 0.002}
            feedback: |
              You have divided by the grand total. The question is about
              students only, so divide by the student row total, 151.
          - value: 0.1115
            tol: {abs: 0.002}
            feedback: |
              You have divided by the has-car total, 278. That answers "what
              proportion of car owners are students", which is a different
              question.
        hints:
          - "\"Of students\" gives you the denominator: the number of students."

      - kind: numeric
        ask: What proportion of carless people are employed?
        answer: 0.072
        tol: {abs: 0.002}
        verify: 21 / 291
        traps:
          - value: 0.139
            tol: {abs: 0.002}
            feedback: |
              You have divided by the employed row total, 151. That answers
              "what proportion of employed people are carless". Read the wording
              again. "Of carless people" makes the carless total, 291, the
              denominator.
        hints:
          - The group named after the word "of" is the denominator. Which group is that?
        solution:
          working: |
            21 carless employed people ÷ 291 carless people = **0.072**

            All these questions have the same shape. Only the denominator
            changes. The group named after "of" is the denominator.
          note: |
            Compare the two directions. They are easy to confuse.

            - "Of carless people, what proportion are employed?" → 21 ÷ 291 = 0.072
            - "Of employed people, what proportion are carless?" → 21 ÷ 151 = 0.139

            The top number is the same. The bottom number is different, and the
            answers differ by almost a factor of two.

      - kind: hypothesis
        ask: Set up the test for whether car ownership is independent of employment status.
        parts:
          - key: h0
            label: Null hypothesis
            options:
              - value: There is no association between owning a car and employment status
                correct: true
              - value: There is an association between owning a car and employment status
                feedback: |
                  This is the alternative hypothesis. H₀ always states that
                  there is no relationship.
              - value: The proportion of car owners is 0.489
                feedback: |
                  This is a fact about the sample, not a hypothesis about a
                  relationship. A χ² test asks whether two classifications are
                  linked.
          - key: h1
            label: Alternative hypothesis
            options:
              - value: There is an association between owning a car and employment status
                correct: true
              - value: There is no association between owning a car and employment status
                feedback: |
                  This is H₀. The alternative is what you conclude if the
                  evidence is strong enough to reject H₀.
              - value: Employment causes car ownership
                feedback: |
                  A χ² test shows that two variables are linked. It cannot show
                  that one causes the other. Students may have fewer cars
                  because they have less money.
          - key: tails
            label: Test type
            options:
              - value: One-tailed (right)
                correct: true
              - value: Two-tailed
                feedback: |
                  A χ² test is never two-tailed. The statistic adds squared
                  values, so it cannot be negative. The distribution has no left
                  tail. Evidence against H₀ always gives a large value.
              - value: One-tailed (left)
                feedback: |
                  A small χ² means the observed and expected counts are close.
                  That supports H₀. The rejection area is always the right tail.
        solution:
          working: |
            - **H₀:** there is no association between car ownership and employment status
            - **H₁:** there is an association
            - Right-tailed χ² test at 1% significance, so α = 0.01

            ![Chi-squared distribution with a single right-hand rejection tail](assets/img/chi-squared-tail.svg)

      - kind: numeric
        ask: |
          Calculate the expected value for **employed people with a car** under
          the null hypothesis.
        answer: 73.775
        tol: {abs: 0.05}
        verify: 151 * 278 / 569
        traps:
          - value: 130
            feedback: |
              This is the observed count. The expected value is the count you
              would see if car ownership and employment were unrelated:
              (row total × column total) ÷ grand total.
          - value: 47.417
            tol: {abs: 0.05}
            feedback: |
              Check which totals you multiplied. Use the employed row total,
              151, and the has-car column total, 278. Then divide by 569.
        hints:
          - "Expected = (row total × column total) ÷ grand total."

      - kind: numeric
        ask: What is the χ² test statistic for the whole table?
        answer: 140.07
        tol: {abs: 0.15}
        verify: |
          float(np.sum((np.array([[130,21],[21,34],[54,50],[31,120],[31,53],[11,13]], dtype=float)
            - np.outer(np.array([151,55,104,151,84,24], dtype=float), np.array([278,291], dtype=float))/569)**2
            / (np.outer(np.array([151,55,104,151,84,24], dtype=float), np.array([278,291], dtype=float))/569)))
        hints:
          - "For each of the 12 cells, calculate (O − E)² ÷ E. Then add the results."
        solution:
          working: |
            Build three tables: observed, expected, and (O − E)² ÷ E. The last
            table adds up to **140.07**.

            | χ² contribution | Has car | No car |
            |---|---|---|
            | Employed | 42.85 | 40.94 |
            | Unemployed | 1.28 | 1.23 |
            | Homemaker | 0.20 | 0.19 |
            | Student | 24.80 | 23.69 |
            | Retired | 2.46 | 2.35 |
            | Disability | 0.04 | 0.04 |
            | **Total** | | **140.07** |

            The employed and student rows contribute 132 of the total 140. These
            two groups are furthest from what independence predicts. Employed
            people own many more cars than expected, and students many fewer.
          excel: "=SUMPRODUCT((observed-expected)^2/expected)"
          r: "chisq.test(m)$statistic"
          python: "scipy.stats.chi2_contingency(m).statistic"
          note: |
            R's `chisq.test` applies Yates' correction to 2×2 tables by default.
            This 6×2 table is not affected. On a 2×2 table, R will disagree with
            your hand calculation unless you pass `correct = FALSE`. In SciPy,
            pass `correction=False`.

      - kind: numeric
        ask: How many degrees of freedom does this table have?
        answer: 5
        tol: {abs: 0}
        verify: (6 - 1) * (2 - 1)
        traps:
          - value: 12
            feedback: |
              This is the number of cells. Degrees of freedom are
              (rows − 1) × (columns − 1) = 5 × 1.
          - value: 11
            feedback: |
              This is cells − 1, the rule for a goodness-of-fit test. For a test
              of independence, use (rows − 1) × (columns − 1).
          - value: 568
            feedback: |
              This is N − 1. Degrees of freedom depend on the shape of the
              table, not on the number of people in it.

      - kind: numeric
        ask: What is the critical value at 1% significance?
        answer: 15.09
        tol: {abs: 0.05}
        verify: CHISQ_INV_RT(0.01, 5)
        traps:
          - value: 11.07
            tol: {abs: 0.05}
            feedback: |
              This is the critical value at 5%. The question asks for 1%, so
              α = 0.01.
          - value: 0.554
            tol: {abs: 0.02}
            feedback: |
              You have used `CHISQ.INV`, which gives the left-hand value. A χ²
              test rejects in the right tail. Use `CHISQ.INV.RT(0.01, 5)`, or
              `CHISQ.INV(0.99, 5)`.
        solution:
          excel: "=CHISQ.INV.RT(0.01,5)"
          r: "qchisq(0.01, df = 5, lower.tail = FALSE)"
          python: "scipy.stats.chi2.isf(0.01, 5)"
          note: |
            Check the name carefully. It is **`CHISQ.INV.RT`**. There is no
            function called `CHI.INV.RT`, and typing that returns `#NAME?`.

            The `.RT` gives the right tail, which is the tail a χ² test uses.

      - kind: decision
        ask: What do you conclude at 1% significance?
        answer: reject
        reasons:
          - value: The test statistic (140.07) is greater than the critical value (15.09)
            correct: true
          - value: The test statistic is smaller than the critical value
            feedback: |
              Check the comparison. 140.07 is much larger than 15.09. For χ², a
              large value is evidence against H₀.
          - value: The sample size is large
            feedback: |
              A large sample makes the test more sensitive. It is not a reason
              to reject H₀. Compare the test statistic with the critical value.
        solution:
          working: |
            χ² test statistic = 140.07. Critical value = 15.09. Since
            140.07 > 15.09, **reject H₀** at the 1% level.

            There is strong evidence of an association between employment status
            and car ownership.

            This shows the two are linked. It does not show that employment
            causes car ownership. Income, age and location affect both.

  # ----------------------------------------------------------- Question 3
  - id: t5-q3
    title: Question 3 — When the expected values are too small
    dataset_label: T5 Accidents Weather
    prompt: |
      Road accidents in Leeds and Manchester, by road surface condition.

      | Observed | Dry | Wet | Snow | Ice |
      |---|---|---|---|---|
      | Leeds | 115 | 174 | 32 | 6 |
      | Manchester | 68 | 71 | 17 | 7 |

      This looks like Question 2. One difference makes the test invalid unless
      you find it.
    steps:
      - kind: table
        ask: Complete the totals.
        tol: {abs: 0}
        corner: "Totals"
        columns: ["Dry", "Wet", "Snow", "Ice", "Row total"]
        rows: ["Leeds", "Manchester", "Column total"]
        given:
          "0,0": "115"
          "0,1": "174"
          "0,2": "32"
          "0,3": "6"
          "1,0": "68"
          "1,1": "71"
          "1,2": "17"
          "1,3": "7"
        cells:
          - {key: lt, row: 0, col: 4, answer: 327}
          - {key: mt, row: 1, col: 4, answer: 163}
          - {key: d, row: 2, col: 0, answer: 183}
          - {key: w, row: 2, col: 1, answer: 245}
          - {key: s, row: 2, col: 2, answer: 49}
          - {key: i, row: 2, col: 3, answer: 13}
          - {key: g, row: 2, col: 4, answer: 490}
        verify: "[327, 163, 183, 245, 49, 13, 490]"

      - kind: numeric
        ask: What is the expected number of ice accidents in Manchester?
        answer: 4.3
        tol: {abs: 0.05}
        verify: 163 * 13 / 490
        hints:
          - "(Manchester row total × ice column total) ÷ grand total."

      - kind: choice
        ask: What does that expected value tell you?
        prose: true
        options:
          - value: It is below 5, so the χ² test is not valid for this table
            correct: true
            feedback: |
              Correct. A χ² test needs every expected value to be at least 5.
              Below that, the test statistic no longer follows the χ²
              distribution closely enough to trust.
          - value: Nothing important, it is only a small number
            feedback: |
              A χ² test requires every expected value to be at least 5. This
              value is 4.3, so the table fails that condition. The p-value would
              not be reliable.
          - value: Manchester has significantly fewer ice accidents than expected
            feedback: |
              Manchester recorded 7 against 4.3 expected, which is more, not
              fewer. The problem is the size of the expected value itself.
          - value: The data must have been recorded wrongly
            feedback: |
              The data is correct. Ice accidents are rare. The problem is that
              χ² needs a minimum expected count in every cell.

      - kind: choice
        ask: What is the correct fix?
        prose: true
        options:
          - value: Combine the snow and ice columns into one category
            correct: true
            feedback: |
              Correct. Snow and ice are both frozen road surfaces, so combining
              them makes sense for transport as well as for statistics. Do not
              combine categories that have nothing in common.
          - value: Delete the ice column
            feedback: |
              This removes 13 real accidents and changes the comparison.
              Combining columns keeps the information.
          - value: Delete Manchester from the analysis
            feedback: |
              This removes half of the comparison, which is what the question
              asks about.
          - value: Continue, and add a note about the problem
            feedback: |
              A note does not make an invalid test valid. Combining the columns
              solves the problem, so do that.

      - kind: numeric
        ask: After combining snow and ice, what is the expected value for Leeds in that column?
        answer: 41.38
        tol: {abs: 0.05}
        verify: 327 * 62 / 490
        hints:
          - The combined column total is 49 + 13 = 62.

      - kind: numeric
        ask: What is the χ² test statistic for the combined table?
        answer: 4.1
        tol: {abs: 0.06}
        verify: |
          float(np.sum((np.array([[115,174,38],[68,71,24]], dtype=float)
            - np.outer(np.array([327,163], dtype=float), np.array([183,245,62], dtype=float))/490)**2
            / (np.outer(np.array([327,163], dtype=float), np.array([183,245,62], dtype=float))/490)))
        solution:
          working: |
            | χ² contribution | Dry | Wet | Snow & Ice |
            |---|---|---|---|
            | Leeds | 0.42 | 0.67 | 0.27 |
            | Manchester | 0.83 | 1.35 | 0.55 |
            | **Total** | | | **4.10** |

      - kind: numeric
        ask: How many degrees of freedom does the combined table have?
        answer: 2
        tol: {abs: 0}
        verify: (2 - 1) * (3 - 1)
        traps:
          - value: 3
            feedback: |
              This is the value for the original four-column table. Combining
              the columns leaves three, so df = (2 − 1) × (3 − 1) = 2. Recount
              the degrees of freedom after combining columns.

      - kind: numeric
        ask: What is the critical value at 5% significance?
        answer: 5.99
        tol: {abs: 0.02}
        verify: CHISQ_INV_RT(0.05, 2)
        solution:
          excel: "=CHISQ.INV.RT(0.05,2)    or  =CHISQ.INV(0.95,2)"
          r: "qchisq(0.95, df = 2)"
          python: "scipy.stats.chi2.isf(0.05, 2)"

      - kind: decision
        ask: |
          Test at 5% significance. H₀ states that the pattern of accidents across
          weather types is the same in Leeds and Manchester.
        answer: fail
        reasons:
          - value: The test statistic (4.10) is smaller than the critical value (5.99)
            correct: true
          - value: The test statistic is larger than the critical value
            feedback: |
              Check again. 4.10 is smaller than 5.99, so the statistic does not
              reach the rejection area.
          - value: We have proved that the two cities are the same
            feedback: |
              Failing to reject H₀ means the evidence was not strong enough to
              reject it. It does not prove H₀ is true. A null hypothesis is
              never confirmed.
        solution:
          working: |
            χ² test statistic = 4.10. Critical value = 5.99. Since 4.10 < 5.99,
            we **cannot reject H₀** at the 5% level.

            There is not enough evidence that the pattern of accidents across
            weather conditions differs between the two cities.

            Compare this with Question 2, where the statistic was 140 against a
            critical value of 15. That was very strong evidence. This is none.

  # ----------------------------------------------------------- Question 4
  - id: t5-q4
    title: Question 4 — Least-squares regression
    dataset_label: T5 Reaction Distance
    prompt: |
      A study measured how the warning distance before a motorway closure
      affects the reaction distance of drivers.

      | Site | Warning distance w (m) | Reaction distance r (m) |
      |---|---|---|
      | 1 | 50 | 41.54 |
      | 2 | 100 | 47.66 |
      | 3 | 80 | 53.25 |
      | 4 | 125 | 58.86 |
      | 5 | 200 | 59.31 |
      | 6 | 400 | 91.31 |
      | 7 | 300 | 92.90 |
      | 8 | 240 | 86.10 |
      | 9 | 180 | 60.18 |
      | 10 | 260 | 88.00 |

      Fit a model of the form **r = aw + b** using least squares.
    steps:
      - kind: choice
        prose: true
        ask: |
          Start by plotting reaction distance against warning distance as a
          scatter chart. What does the relationship look like?
        options:
          - value: Roughly linear. Reaction distance rises steadily as warning distance grows
            correct: true
            feedback: |
              Correct. The points rise together, so a straight line is a
              reasonable model. Always check this before you calculate the
              coefficients. If the points had no pattern, a line would describe
              nothing.
          - value: No relationship. The points look random
            feedback: |
              Look again. The sites with short warning distances are at the
              bottom left, and the long ones at the top right. The rise is
              clear. If the points really had no pattern, you should stop rather
              than fit a line.
          - value: Strongly curved. A straight line cannot describe it
            feedback: |
              The points do flatten a little at the right, which matters for the
              predictions later. Across most of the data the rise is close
              enough to straight for a linear model.
        solution:
          working: |
            In Excel, select both data columns, then choose **Insert →
            Scatter**. Use the first option, with markers only.

            Put warning distance on the horizontal axis. It is the value you
            control, so it is the predictor.

            Plot the data before you fit a model. The chart shows whether a
            straight line is suitable. It also shows the flattening beyond about
            300 m, which matters for the predictions later in this question.
          r: "plot(warning, reaction)"
          python: "df.plot.scatter(x='warning_distance_m', y='reaction_distance_m')"

      - kind: table
        ask: Calculate the summary quantities.
        tol: {abs: 1.0}
        corner: "Quantity"
        columns: ["S_xx", "S_yy", "S_xy"]
        rows: ["Value"]
        cells:
          - {key: sxx, row: 0, col: 0, answer: 107702.5, tol: {abs: 2}}
          - {key: syy, row: 0, col: 1, answer: 3442.51, tol: {abs: 2}}
          - {key: sxy, row: 0, col: 2, answer: 17685.1, tol: {abs: 2}}
        verify: |
          [float((warning**2).sum() - 10*warning.mean()**2),
           float((reaction**2).sum() - 10*reaction.mean()**2),
           float((warning*reaction).sum() - 10*warning.mean()*reaction.mean())]
        hints:
          - "S_xx = Σw² − n·w̄². The other two follow the same pattern."
          - "w̄ = 193.5 and r̄ = 67.911."

      - kind: numeric
        ask: What is the gradient a?
        answer: 0.164
        tol: {abs: 0.003}
        verify: |
          float(((warning*reaction).sum() - 10*warning.mean()*reaction.mean())
                / ((warning**2).sum() - 10*warning.mean()**2))
        traps:
          - value: 36.138
            tol: {abs: 0.05}
            feedback: |
              This is the intercept b. The gradient is S_xy ÷ S_xx. Check the
              size: the gradient must be small, because reaction distance rises
              by tens of metres while warning distance rises by hundreds.
          - value: 6.09
            tol: {abs: 0.1}
            feedback: |
              You have divided S_xx by S_xy. The gradient is S_xy ÷ S_xx.
        hints:
          - "a = S_xy ÷ S_xx."
        solution:
          working: |
            a = S_xy ÷ S_xx = 17685.1 ÷ 107702.5 = **0.164**

            Each extra metre of warning distance adds about 0.164 m of reaction
            distance.

      - kind: numeric
        ask: What is the intercept b?
        answer: 36.138
        tol: {abs: 0.05}
        verify: |
          float(reaction.mean() - ((warning*reaction).sum() - 10*warning.mean()*reaction.mean())
                / ((warning**2).sum() - 10*warning.mean()**2) * warning.mean())
        hints:
          - "b = r̄ − a·w̄. This makes the line pass through the mean of the data."
        solution:
          working: |
            b = r̄ − a·w̄ = 67.911 − 0.164 × 193.5 = **36.138**

            The model is **r = 0.164w + 36.138**.
          excel: "=SLOPE(r_range, w_range)   and  =INTERCEPT(r_range, w_range)"
          r: "coef(lm(reaction ~ warning))"
          python: "scipy.stats.linregress(w, r)   # .slope and .intercept"
          note: |
            `LINEST` returns both coefficients together, but in the opposite
            order to the equation. It gives the gradient first, then the
            intercept. `SLOPE` and `INTERCEPT` are harder to confuse.

      - kind: numeric
        ask: What is the R² value?
        answer: 0.84
        tol: {abs: 0.01}
        verify: |
          float(1 - ((reaction - (((warning*reaction).sum() - 10*warning.mean()*reaction.mean())
                / ((warning**2).sum() - 10*warning.mean()**2)) * warning
                - (reaction.mean() - (((warning*reaction).sum() - 10*warning.mean()*reaction.mean())
                / ((warning**2).sum() - 10*warning.mean()**2)) * warning.mean()))**2).sum()
                / ((reaction**2).sum() - 10*reaction.mean()**2))
        traps:
          - value: 0.916
            tol: {abs: 0.01}
            feedback: |
              This is r, the correlation coefficient. R² is its square. R² gives
              the share of variation the model explains.
          - value: 0.16
            tol: {abs: 0.01}
            feedback: |
              This is 1 − R². The formula is R² = 1 − (SSE ÷ SST). You have
              stopped at SSE ÷ SST.
        hints:
          - "R² = 1 − (SSE ÷ SST), where SSE = 538.56 and SST = S_yy = 3442.51."
        solution:
          working: |
            R² = 1 − (538.56 ÷ 3442.51) = **0.84**

            The model explains about 84% of the variation in reaction distance.
            The other 16% comes from everything else: driver behaviour, traffic
            and weather.
          excel: "=RSQ(r_range, w_range)"
          r: "summary(lm(reaction ~ warning))$r.squared"
          python: "scipy.stats.linregress(w, r).rvalue**2"

      - kind: table
        ask: Use the model to predict the reaction distance at each warning distance.
        tol: {abs: 0.15}
        corner: "Warning distance"
        columns: ["w = 90", "w = 150", "w = 500", "w = 1200"]
        rows: ["Predicted r (m)"]
        cells:
          - {key: p90,   row: 0, col: 0, answer: 50.92,  also_accept: [50.90]}
          - {key: p150,  row: 0, col: 1, answer: 60.77,  also_accept: [60.74]}
          - {key: p500,  row: 0, col: 2, answer: 118.24, also_accept: [118.14]}
          - {key: p1200, row: 0, col: 3, answer: 233.18, also_accept: [232.94]}
        verify: |
          [float(stats.linregress(warning, reaction).slope * wi
                 + stats.linregress(warning, reaction).intercept)
           for wi in (90, 150, 500, 1200)]
        solution:
          working: |
            Substitute each value into **r = 0.1642w + 36.1376**:

            | w (m) | 90 | 150 | 500 | 1200 |
            |---|---|---|---|---|
            | Predicted r (m) | 50.92 | 60.77 | 118.24 | 233.18 |

            These use the coefficients at full precision, which is what `SLOPE`,
            `INTERCEPT` and `LINEST` give you.
          note: |
            **Rounding the gradient changes the result.** If you round a to
            0.164 before predicting, you get 232.94 at w = 1200 instead of
            233.18.

            Either value is correct here. Note how the gap grows. At w = 90 it
            is 0.02 m. At w = 1200 it is 0.24 m, because the rounding error in
            the gradient is multiplied by w.

            **Round at the end of a calculation, not in the middle.** Keep full
            precision in your cells. Use Excel's display settings if you want to
            show fewer digits.

      - kind: multi
        ask: |
          Which of these predictions can you trust? Select all that apply.
        prose: true
        options:
          - value: "w = 90, inside the range of the data"
            correct: true
          - value: "w = 150, inside the range of the data"
            correct: true
          - value: "w = 500, beyond the largest measurement of 400 m"
            feedback: |
              This is extrapolation. The model has no data above 400 m. The data
              also suggests the relationship flattens beyond about 300 m,
              because drivers change their behaviour. A realistic estimate is
              about 90 m, not 118 m.
          - value: "w = 1200, three times the largest measurement"
            feedback: |
              This is far outside the data. The model predicts 233 m, but there
              is no evidence that the straight line continues that far. The data
              suggests it does not. A realistic estimate is still about 90 m.
        solution:
          working: |
            Only w = 90 and w = 150 lie inside the range of the data, which is
            50 to 400 m.

            Look at the scatter chart. The rise flattens beyond about 300 m.
            This makes physical sense. Drivers respond to information and adjust
            their behaviour, rather than reacting in proportion without limit.
            Beyond about 300 m, a reaction distance of about 90 m is the
            sensible estimate.

            **A model is only evidence about the range of data you fitted it
            to.** Predicting outside that range is the most common way a
            regression gives a wrong answer.

      - kind: numeric
        ask: |
          Test whether the gradient is different from zero at 95% confidence.
          What is the t statistic?
        answer: 6.56
        tol: {abs: 0.05}
        verify: |
          float(stats.linregress(warning, reaction).slope / stats.linregress(warning, reaction).stderr)
        hints:
          - "Residual standard error s = √(SSE ÷ (n − 2)) = √(538.6 ÷ 8) = 8.2."
          - "SE(a) = s ÷ √S_xx. Then t = a ÷ SE(a)."
        solution:
          working: |
            - H₀: a = 0, the gradient is zero. H₁: a ≠ 0. Two-tailed, α = 0.05.
            - Residual standard error s = √(538.6 ÷ 8) = 8.2
            - SE(a) = 8.2 ÷ √107702.5 = 0.0250
            - t = 0.164 ÷ 0.0250 = **6.56**

            The degrees of freedom are n − 2, not n − 1, because you estimated
            two coefficients from the data.
          excel: "Use the Regression Coeff T sheet of the workbench, or =LINEST(y,x,TRUE,TRUE)"
          r: "summary(lm(reaction ~ warning))   # gives t and p directly"
          python: "scipy.stats.linregress(w, r)   # .slope / .stderr"

      - kind: decision
        ask: What do you conclude about the gradient?
        answer: reject
        reasons:
          - value: t = 6.56 exceeds the critical value T.INV(0.975, 8) = 2.306
            correct: true
          - value: R² is high, at 0.84
            feedback: |
              R² and the t-test answer different questions. R² measures how much
              variation the model explains. The t-test asks whether the gradient
              could be zero. Use the t statistic for this decision.
          - value: The gradient is positive
            feedback: |
              The sign gives the direction of the relationship, not its
              strength. A very small positive gradient with a large standard
              error would not be significant.
        solution:
          working: |
            t = 6.56. Critical value = 2.306. Since 6.56 > 2.306, **reject H₀**.

            The gradient is different from zero at 95% confidence. Warning
            distance does predict reaction distance.

            This applies between 50 and 400 m. It says nothing about 1200 m, and
            it does not prove that one causes the other.
