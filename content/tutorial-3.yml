tutorial: 3
title: Sampling Distributions and Interval Estimation

intro: |
  You rarely measure a whole population. You measure a sample, then make a
  claim about the population. A confidence interval states how precise that
  claim is.

learning_outcomes:
  - Calculate critical values from the normal distribution.
  - Differentiate between sample and population parameters.
  - Identify and apply strategies for estimating the confidence of sample parameter values.

datasets:
  - id: fuel
    name: Fuel consumption
    csv: fuel-consumption.csv
    sheet: T3 Fuel Consumption
  - id: hgv
    name: HGV weights
    csv: hgv-weights.csv
    sheet: T3 HGV Weights

supplementary: |
  ![The five steps of the interval estimation method](assets/img/method-intervals.svg)

  **Use the standard error, not the standard deviation.**

  A confidence interval does not describe how spread out your data is. It
  describes how precisely you have measured the **mean**. These are different
  questions with different answers.

  The spread value you put into `NORM.INV` is the **standard error**. That is
  the standard deviation divided by √n.

  More data gives a narrower interval, because √n grows and the standard error
  gets smaller.

  ### Which case applies?

  Two questions decide the case:

  1. **Do you know the population standard deviation?** If yes, use σ. If no,
     estimate it from the sample and use S.
  2. **Can you use the normal distribution?** You can if the population is
     normal, or if the sample is large enough for the central limit theorem. If
     neither is true, use the t-distribution.

  The table below lists the combinations. The questions refer to these case
  numbers.

  | Case | Population normal? | Population variance known? | Sample size | Use | Statistic |
  |---|---|---|---|---|---|
  | **1** | Yes | Yes | any | Inverse Normal | (X̄ − μ) ÷ (σ/√n) ~ Nor(0,1) |
  | **2** | No | Yes | n ≥ 20 | Inverse Normal | (X̄ − μ) ÷ (σ/√n) ~ Nor(0,1) |
  | **3** | Yes | No | any | Inverse t | (X̄ − μ) ÷ (S/√n) ~ t(n−1) |
  | **4** | No | No | n ≥ 30 | Inverse Normal | (X̄ − μ) ÷ (S/√n) ~ Nor(0,1) |
  | **4** | Roughly normal | No | n ≥ 20 | Inverse t | (X̄ − μ) ÷ (S/√n) ~ t(n−1) |

questions:

  # ----------------------------------------------------------- Question 1
  - id: t3-q1
    title: Question 1 — Critical values
    prompt: |
      A normal distribution has mean μ = 25 and standard deviation 3. Find the
      critical value c where **P(μ − c < X < μ + c) = 0.95**.

      This question is about the distribution itself, not about a sample. Use
      the standard deviation, not a standard error.
    steps:
      - kind: numeric
        ask: What area lies in *each* tail?
        answer: 0.025
        tol: {abs: 0.0005}
        verify: (1 - 0.95) / 2
        traps:
          - value: 0.05
            tol: {abs: 0.0005}
            feedback: |
              This is the area in **both** tails together. The normal
              distribution is symmetric, so divide 0.05 by 2. Each tail holds
              0.025.
          - value: 0.95
            feedback: |
              This is the area in the middle. The tails hold what is left:
              1 − 0.95, shared between two tails.
        hints:
          - The total area is 1. The middle holds 0.95. How much is left, and how many tails share it?

      - kind: interval
        ask: Give the lower and upper bounds of the interval.
        lower: 19.12
        upper: 30.88
        tol: {abs: 0.02}
        verify: "[NORM_INV(0.025, 25, 3), NORM_INV(0.975, 25, 3)]"
        traps:
          - value: 20.065
            tol: {abs: 0.02}
            feedback: |
              You have used 0.05 for the lower bound. Each tail takes half of α,
              so use 0.025.
        solution:
          excel: "=NORM.INV(0.025,25,3)   and  =NORM.INV(0.975,25,3)"
          r: "qnorm(c(0.025, 0.975), mean = 25, sd = 3)"
          python: "scipy.stats.norm.ppf([0.025, 0.975], 25, 3)"

      - kind: numeric
        ask: What is the critical value c?
        answer: 5.88
        tol: {abs: 0.02}
        verify: NORM_INV(0.975, 25, 3) - 25
        traps:
          - value: 30.88
            feedback: |
              This is the upper bound. The value c is the distance from the
              mean: 30.88 − 25.
          - value: 11.76
            tol: {abs: 0.03}
            feedback: |
              This is the full width of the interval. The value c is half of it,
              measured from the mean to one bound.
        solution:
          working: |
            c = 30.88 − 25 = 25 − 19.12 = **5.88**

            Note that 5.88 = 1.96 × 3. The value 1.96 is the 95% critical value
            of the standard normal distribution. You will use it often.
          excel: "=NORM.INV(0.975,25,3)-25    or  =NORM.S.INV(0.975)*3"

  # ----------------------------------------------------------- Question 2
  - id: t3-q2
    title: Question 2 — The same method, different numbers
    prompt: |
      A normal distribution has mean −2 and standard deviation 0.1. Find the
      critical value c where **P(μ − c < X < μ + c) = 0.99**.

      Use the method from Question 1. The mean is negative and the confidence
      level has changed.
    steps:
      - kind: numeric
        ask: What area lies in each tail now?
        answer: 0.005
        tol: {abs: 0.0002}
        verify: (1 - 0.99) / 2
        traps:
          - value: 0.01
            tol: {abs: 0.0002}
            feedback: |
              This is both tails together. Divide by 2. Each tail holds 0.005.
          - value: 0.025
            tol: {abs: 0.0002}
            feedback: |
              This is the value for a 95% interval. Here the interval is 99%, so
              α = 0.01 and each tail holds 0.005.

      - kind: interval
        ask: Give the lower and upper bounds.
        lower: -2.258
        upper: -1.742
        tol: {abs: 0.005}
        verify: "[NORM_INV(0.005, -2, 0.1), NORM_INV(0.995, -2, 0.1)]"
        traps:
          - value: 2.258
            tol: {abs: 0.005}
            feedback: |
              Check the signs. The mean is −2, so both bounds are negative. The
              lower bound is −2.258.
        hints:
          - The mean is negative, so both bounds are negative. The lower bound is further from zero.

      - kind: numeric
        ask: What is the critical value c?
        answer: 0.258
        tol: {abs: 0.005}
        verify: NORM_INV(0.995, -2, 0.1) + 2
        solution:
          working: |
            c = −1.742 − (−2) = **0.258**

            In Question 1 the multiplier was 1.96, for 95% confidence. Here it
            is 2.576, for 99%. Higher confidence gives a wider interval. To gain
            confidence and precision at the same time, you need more data.
          excel: "=NORM.INV(0.995,-2,0.1)+2"

  # ----------------------------------------------------------- Question 3
  - id: t3-q3
    title: Question 3 — Fuel consumption
    dataset_label: T3 Fuel Consumption
    prompt: |
      A study measured the fuel consumption of **27 cars**. The data is on the
      **T3 Fuel Consumption** sheet. The **population** standard deviation is
      **1.3 L/100km**.
    steps:
      - kind: numeric
        ask: What is the mean of the sample data?
        answer: 10.08
        tol: {abs: 0.02}
        unit: L/100km
        verify: float(fuel.mean())
        solution:
          excel: "=AVERAGE(B4:B30)"
          r: "mean(fuel_l_per_100km)"
          python: "df.fuel_l_per_100km.mean()"

      - kind: choice
        ask: Which case from the table applies here?
        options:
          - value: Case 2
            correct: true
            feedback: |
              Correct. The question does not say the population is normal. It
              does give the population standard deviation, and n = 27 is at
              least 20. Case 2 uses the inverse normal with σ.
          - value: Case 1
            feedback: |
              Case 1 needs a normal population. The question does not say the
              population is normal, so you cannot assume it.
          - value: Case 3
            feedback: |
              Case 3 is for an unknown population variance. Here σ is given, so
              use it.
          - value: Case 4
            feedback: |
              Case 4 is for an unknown population variance. Here σ = 1.3 is
              given, so Case 2 applies.
        hints:
          - Ask the two questions. Do you know the population standard deviation? Can you use the normal distribution?

      - kind: numeric
        ask: What is the spread parameter (the standard error) for the interval?
        answer: 0.25
        tol: {abs: 0.005}
        verify: 1.3 / math.sqrt(27)
        traps:
          - value: 1.3
            tol: {abs: 0.005}
            feedback: |
              This is the population standard deviation. The interval measures
              the precision of the mean, so divide by √n: 1.3 ÷ √27.
          - value: 0.0481
            tol: {abs: 0.005}
            feedback: |
              You have divided by n. Divide by √n, the square root of the sample
              size.
        hints:
          - Standard error = σ ÷ √n.
        solution:
          working: |
            Standard error = σ ÷ √n = 1.3 ÷ √27 = **0.25**
          note: |
            **Excel names this argument `standard_dev`.** In the next part you
            put 0.25 into `NORM.INV`, in an argument labelled `standard_dev`. It
            looks like the wrong value, but it is correct.

            `NORM.INV` needs the standard deviation of the distribution you are
            describing. Here that distribution is not the fuel consumption of
            single cars. It is the distribution of **sample means**. The
            standard deviation of that distribution is the standard error.

            A standard error is a standard deviation. It measures a different
            thing: not how much cars vary, but how much your estimate of the
            average would vary if you repeated the survey.

      - kind: interval
        ask: Estimate a 95% confidence interval for the population mean fuel consumption.
        lower: 9.59
        upper: 10.57
        tol: {abs: 0.02}
        unit: L/100km
        n: 27
        verify: "[NORM_INV(0.025, float(fuel.mean()), 1.3/math.sqrt(27)), NORM_INV(0.975, float(fuel.mean()), 1.3/math.sqrt(27))]"
        solution:
          working: |
            Case 2 uses the inverse normal with the population σ. The standard
            error is 1.3 ÷ √27 = 0.25.

            - `=NORM.INV(0.025, 10.08, 0.25)` = 9.59
            - `=NORM.INV(0.975, 10.08, 0.25)` = 10.57

            **With 95% confidence, the population mean fuel consumption is
            10.08 ± 0.49 L/100km.**

            This states where the population **mean** lies. It does not state
            where the consumption of a single car lies.
          excel: "=NORM.INV(0.025,10.08,0.25)   and  =NORM.INV(0.975,10.08,0.25)"
          r: "mean(x) + c(-1,1) * qnorm(0.975) * 1.3 / sqrt(27)"
          python: "df.x.mean() + np.array([-1,1]) * scipy.stats.norm.ppf(.975) * 1.3/np.sqrt(27)"
          note: |
            The third argument of `NORM.INV` is labelled `standard_dev`, and you
            pass it the standard error, 0.25. This is correct. If you pass 1.3
            instead, you get the range covering single cars, which is much
            wider.

            Excel also has `CONFIDENCE.NORM(alpha, sigma, n)`. It takes σ and n
            separately and divides by √n for you.
            `=CONFIDENCE.NORM(0.05, 1.3, 27)` returns the half-width, 0.49.

      - kind: choice
        ask: What happens to the 95% confidence interval if you increase the sample size?
        options:
          - value: It gets narrower
            correct: true
            feedback: |
              Correct. The standard error is σ ÷ √n. A larger n makes it
              smaller, so the interval narrows. Note the square root: to halve
              the width, you need **four times** as much data.
          - value: It gets wider
            feedback: |
              More data gives a more precise estimate of the mean, so the
              interval gets narrower.
          - value: It stays the same
            feedback: |
              The sample size is part of the standard error, σ ÷ √n. Changing n
              changes the interval.
          - value: It depends on the values of the new observations
            feedback: |
              In Case 2, σ is known and fixed, so the width depends only on n.
              New values move the centre of the interval, but not its width.

  # ----------------------------------------------------------- Question 4
  - id: t3-q4
    title: Question 4 — HGV weights
    dataset_label: T3 HGV Weights
    prompt: |
      Noise pollution may be linked to heavy goods vehicles. The weight of **38
      vehicles** was measured. The data is on the **T3 HGV Weights** sheet.

      Estimate the mean weight of HGVs on these roads, with a 95% confidence
      interval. You are given nothing about the population, only the sample.
    steps:
      - kind: numeric
        ask: What is the sample mean?
        answer: 22.29
        tol: {abs: 0.02}
        unit: tonnes
        verify: float(hgv.mean())

      - kind: numeric
        ask: What is the sample standard deviation?
        answer: 7.59
        tol: {abs: 0.02}
        unit: tonnes
        verify: stdev_s(hgv)
        traps:
          - value: 7.49
            tol: {abs: 0.03}
            feedback: |
              This is `STDEV.P`. These 38 vehicles are a sample of all HGVs on
              the road, so use `STDEV.S`.

      - kind: choice
        ask: Which case applies?
        options:
          - value: Case 4
            correct: true
            feedback: |
              Correct. You know neither the population distribution nor its
              variance. But n = 38 is above 30, so the central limit theorem
              allows the inverse normal with the sample standard deviation.
          - value: Case 2
            feedback: |
              Case 2 needs a known population variance. Here you have only the
              sample standard deviation.
          - value: Case 3
            feedback: |
              Case 3 needs a normal population. The question does not say the
              population is normal. With n = 38 you can use the central limit
              theorem instead, which is Case 4.
          - value: Case 1
            feedback: |
              Case 1 needs a normal population and a known variance. You have
              neither.

      - kind: interval
        ask: Give the 95% confidence interval for the mean HGV weight.
        lower: 19.88
        upper: 24.70
        tol: {abs: 0.03}
        unit: tonnes
        n: 38
        verify: "[NORM_INV(0.025, float(hgv.mean()), stdev_s(hgv)/math.sqrt(38)), NORM_INV(0.975, float(hgv.mean()), stdev_s(hgv)/math.sqrt(38))]"
        traps:
          - value: 7.41
            tol: {abs: 0.15}
            feedback: |
              You have used the standard deviation, 7.59, as the spread value.
              Use the standard error: 7.59 ÷ √38 = 1.23. The interval measures
              the precision of the mean, not the spread of single vehicles.
        hints:
          - Standard error = 7.59 ÷ √38.
        solution:
          working: |
            - Sample mean 22.29, sample standard deviation 7.59, n = 38
            - Standard error = 7.59 ÷ √38 = 1.23
            - `=NORM.INV(0.025, 22.29, 1.23)` = 19.88
            - `=NORM.INV(0.975, 22.29, 1.23)` = 24.70

            **With 95% confidence, the mean weight of the HGV population is
            22.29 ± 2.41 tonnes.**
          excel: "=NORM.INV(0.025,22.29,1.23)   and  =NORM.INV(0.975,22.29,1.23)"
          r: "mean(w) + c(-1,1) * qnorm(0.975) * sd(w) / sqrt(38)"
          python: "scipy.stats.norm.interval(0.95, df.w.mean(), df.w.std()/np.sqrt(38))"
          note: |
            Try the same calculation with the t-distribution and compare. With
            37 degrees of freedom the critical t is 2.026, against 1.96 for the
            normal. The interval is about 3% wider.

            As n grows, the t-distribution gets closer to the normal. This is
            why Case 4 allows the normal when the sample is large.

  # ----------------------------------------------------------- Question 5
  - id: t3-q5
    title: Question 5 — What extra knowledge buys you
    dataset_label: T3 HGV Weights
    prompt: |
      Repeat Question 4. This time, assume the **population variance is 64** and
      that vehicle weights are **normally distributed**. What has changed?
    steps:
      - kind: numeric
        ask: What is the population standard deviation?
        answer: 8
        tol: {abs: 0.01}
        unit: tonnes
        verify: math.sqrt(64)
        traps:
          - value: 64
            feedback: |
              This is the variance. Take its square root. The interval uses the
              standard deviation.

      - kind: choice
        ask: Which case applies now?
        options:
          - value: Case 1
            correct: true
            feedback: |
              Correct. The population is normal and its variance is known. This
              is Case 1, and there is no minimum sample size.
          - value: Case 2
            feedback: |
              Case 2 is for when you cannot assume a normal population. Here the
              question states that the population is normal, so Case 1 applies.
              The calculation is the same, but the reason is stronger.
          - value: Case 4
            feedback: |
              Case 4 is for an unknown population variance. Here the variance is
              given as 64. The calculation is the same, but you should record
              the stronger reason.
          - value: Case 3
            feedback: |
              Case 3 is for a normal population with an **unknown** variance.
              Here the variance is given.

      - kind: interval
        ask: Give the new 95% confidence interval.
        lower: 19.75
        upper: 24.83
        tol: {abs: 0.03}
        unit: tonnes
        n: 38
        verify: "[NORM_INV(0.025, float(hgv.mean()), 8/math.sqrt(38)), NORM_INV(0.975, float(hgv.mean()), 8/math.sqrt(38))]"
        solution:
          working: |
            The standard error now uses the population σ: 8 ÷ √38 = 1.298.

            - `=NORM.INV(0.025, 22.29, 1.29777)` = 19.75
            - `=NORM.INV(0.975, 22.29, 1.29777)` = 24.83

            **22.29 ± 2.54 tonnes.**
          note: |
            In Question 4, the same `NORM.INV` calculation was justified by the
            central limit theorem and a sample estimate of the spread. Here it
            is justified by a normal population and a known σ. The function is
            the same. The reason is different, and the reason is what you must
            defend.

      - kind: freetext
        ask: |
          The interval is *wider* than in Question 4, although you now know
          more. Explain why. Then say whether the new interval is better or
          worse.
        min_length: 80
        rubric:
          - States that the population standard deviation (8) is larger than the sample estimate (7.59), which widened the interval.
          - States that the new interval is more reliable, because it uses a known value instead of an estimate from 38 vehicles.
          - Separates a narrower interval from a better interval.
        solution:
          working: |
            **Model answer.** The interval is wider because the population
            standard deviation, 8 tonnes, is larger than the estimate from our
            sample, 7.59 tonnes. Our 38 vehicles happened to vary a little less
            than the whole fleet. The new interval is still the better one,
            because it uses a known property of the population instead of an
            estimate that could be wrong. A narrower interval is not always a
            better interval. Treat any method that reduces your stated
            uncertainty without adding information with caution.
          note: |
            A narrower interval is not automatically better. An interval is only
            as reliable as the assumptions behind it.

  # ----------------------------------------------------------- Question 6
  - id: t3-q6
    title: Question 6 — Sigma notation
    prompt: |
      Some fields state confidence as **n-sigma**. This counts how many standard
      deviations the interval covers.

      | | Confidence | Strength of evidence |
      |---|---|---|
      | 1-sigma | 68% | weak |
      | 2-sigma | 95.4% | moderate |
      | 3-sigma | 99.7% | strong |
      | 4-sigma | >99.99% | very strong |

      A study of driving speed on a motorway measured 100 vehicles. The average
      speed was **64 mph**. The variance was **9 mph²**.
    note: |
      Check the units. Variance is measured in **squared** units, so 9 mph².
      This tells you the standard deviation is 3 mph, not 9. If you see a
      variance given in plain mph, check which value is meant.
    steps:
      - kind: numeric
        ask: What is the standard deviation?
        answer: 3
        tol: {abs: 0.01}
        unit: mph
        verify: math.sqrt(9)
        traps:
          - value: 9
            feedback: |
              This is the variance. Take its square root. The units tell you
              which is which: variance is in mph², standard deviation in mph.

      - kind: table
        ask: Give the half-width of each sigma interval.
        tol: {abs: 0.01}
        corner: "Interval"
        columns: ["1-sigma", "2-sigma", "3-sigma", "4-sigma"]
        rows: ["± mph"]
        cells:
          - {key: s1, row: 0, col: 0, answer: 3}
          - {key: s2, row: 0, col: 1, answer: 6}
          - {key: s3, row: 0, col: 2, answer: 9}
          - {key: s4, row: 0, col: 3, answer: 12}
        verify: "[3, 6, 9, 12]"
        solution:
          working: |
            The standard deviation is 3 mph.

            | | Interval |
            |---|---|
            | 1-sigma | 64 ± 3 mph |
            | 2-sigma | 64 ± 6 mph |
            | 3-sigma | 64 ± 9 mph |
            | 4-sigma | 64 ± 12 mph |

            This method needs no critical value lookup. It works only when the
            inverse normal is suitable. Do not use it when the t-distribution is
            required.
          note: |
            2-sigma is 95.4%, not 95%. A 95% interval is 1.96 sigma. The two are
            close, but quote the correct one.
