      - kind: choice
        ask: Which statistic was affected *most* by removing a single observation?
        options:
          - value: Variance
            correct: true
            feedback: |
              Yes — it fell from 113.99 to 87.78, a drop of about 23%. Variance
              squares each deviation from the mean, so a value 38 minutes above
              the mean contributes enormously. Measures of spread are far more
              sensitive to extremes than measures of centre.
          - value: Mean
            feedback: |
              The mean moved only 0.71 minutes, about 3%. It is affected, but
              much less than one of the others — look at the measures of spread.
          - value: Median
            feedback: |
              The median barely moved at all (19 to 18.5), which is precisely
              why it is the more robust measure of centre. Look instead at the
              measures of spread.
          - value: Mode
            feedback: |
              The mode did not move at all — it is still 12. Removing one
              extreme value cannot change which value occurs most often.

      - kind: freetext
        ask: |
          Write two or three sentences explaining what this comparison tells you
          about handling outliers, as you would put it to a colleague who does
          not do statistics.
        min_length: 80
        rubric:
          - Says which statistics moved a lot (spread — variance, standard deviation, skew) and which barely moved (mode, median, mean).
          - Explains *why* — squaring the deviations means extreme values dominate measures of spread.
          - Draws the practical conclusion that data must be checked for outliers before summarising it.
          - Is written in plain language, without unexplained jargon.
        solution:
          working: |
            **Model answer.** Removing a single unusually slow journey barely
            changed the typical travel time — the mean dropped by 0.7 minutes
            and the median by half a minute — but it changed our picture of how
            *variable* journeys are a great deal, cutting the variance by
            almost a quarter and nearly halving the skew. This is because
            measures of spread square the distance of each observation from the
            mean, so a single extreme value counts for far more than an
            ordinary one. The practical lesson is that you have to look at your
            data before you summarise it: quoting a standard deviation without
            checking for outliers can badly misrepresent how reliable a journey
            time actually is.
