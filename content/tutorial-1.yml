tutorial: 1
title: Descriptive Statistics and Data Visualisation

intro: |
  This tutorial covers how to describe a set of data. You will identify the
  type of data, calculate summary statistics, draw two charts, and find an
  outlier.

learning_outcomes:
  - Identify different types of data.
  - Calculate basic statistical properties of data sets.
  - Create visualisations of data sets.

datasets:
  - id: travel-times
    name: Car travel time survey
    csv: travel-times.csv
    sheet: T1 Travel Times

data_note: |
  On the **T1 Travel Times** sheet, the 55 values are in cells **B4:B58**. The
  solutions use this range.

supplementary: |
  Do the calculations in Excel, R or Python. Then enter each answer to check
  it.

  Some questions have long tables. These ask for a few rows only. The full
  table is in the solution.

questions:

  # ----------------------------------------------------------- Question 1
  - id: t1-q1
    title: Question 1 — Types of data
    prompt: |
      Data can be **continuous**, **discrete**, **grouped**, **ordinal** or
      **nominal**. Choose the type for each example below.

      A reminder of the five types:

      - **Continuous** — any value in a range, including fractions (rainfall in mm)
      - **Discrete** — whole numbers only (number of bicycles sold)
      - **Grouped** — numbers sorted into bands (income of £20–30k)
      - **Ordinal** — categories with an order (poor / fair / good)
      - **Nominal** — categories with no order (paint colours)
    steps:
      - kind: choice
        prose: true
        ask: Speed of a moving vehicle over time.
        options:
          - value: Continuous
            correct: true
          - value: Discrete
            feedback: |
              Discrete data has separate values you can count. Speed can take
              any value in between. For example, 31.4157 mph is possible.
          - value: Grouped
            feedback: |
              Grouped data has been sorted into bands. This speed data has not.
              You could group it later into 10 mph bands.
          - value: Ordinal
            feedback: |
              Ordinal data is categories with an order. Speed is a number you
              measure, not a category.
        hints:
          - Can a value exist halfway between two measurements?

      - kind: choice
        prose: true
        ask: Ranking of traffic congestion (high, medium, low).
        options:
          - value: Ordinal
            correct: true
          - value: Nominal
            feedback: |
              These are categories, but they have an order. High congestion is
              worse than low congestion. Nominal categories have no order.
          - value: Discrete
            feedback: |
              Discrete data is whole numbers. "High" is a label, not a number.
          - value: Grouped
            feedback: |
              Grouped data starts as numbers and is then sorted into bands.
              These categories were never numbers.
        hints:
          - Nominal and ordinal are both categories. Does one category mean "more" than another?

      - kind: choice
        prose: true
        ask: Age range of drivers involved in accidents (18–25, 26–35, 36–45, 45+).
        options:
          - value: Grouped
            correct: true
          - value: Ordinal
            feedback: |
              The bands do have an order. But the order comes from numbers, not
              from a judgement. The data started as ages and was sorted into
              bands. That makes it grouped.
          - value: Continuous
            feedback: |
              Age is continuous. But this data has been sorted into bands. You
              now know only the band, so the data is grouped.
          - value: Discrete
            feedback: |
              The ages are discrete. Here they have been sorted into ranges,
              which makes the data grouped.
        hints:
          - The key word is "range". What happened to the original ages?

      - kind: choice
        prose: true
        ask: Vehicle types (car, truck, bus, and so on).
        options:
          - value: Nominal
            correct: true
          - value: Ordinal
            feedback: |
              These categories have no order. A bus is not better or worse than
              a car, only different. With no order, the data is nominal.
          - value: Discrete
            feedback: |
              You can count buses. But the data itself is a label, not a number.
          - value: Grouped
            feedback: |
              Grouped data starts as numbers. Vehicle type was never a number.

      - kind: choice
        prose: true
        ask: Number of passengers on a bus.
        options:
          - value: Discrete
            correct: true
          - value: Continuous
            feedback: |
              You cannot have 23.7 passengers. Only whole numbers are possible,
              so the data is discrete.
          - value: Grouped
            feedback: |
              It would be grouped if you were told "20–29 passengers". An exact
              count is not grouped.
          - value: Nominal
            feedback: |
              This is a count. The numbers mean what they say: 30 passengers is
              more than 15. So the data is numerical, not categorical.
    solution:
      working: |
        | Example | Type | Reason |
        |---|---|---|
        | Speed over time | Continuous | Any value in a range |
        | Congestion ranking | Ordinal | Categories with an order |
        | Age range | Grouped | Numbers sorted into bands |
        | Vehicle type | Nominal | Categories with no order |
        | Passenger count | Discrete | Whole numbers only |
      note: |
        The data type decides which statistics you can use. You cannot
        calculate the mean of a nominal variable. You should not use a normal
        distribution for a count.

  # ----------------------------------------------------------- Question 2
  - id: t1-q2
    title: Question 2 — Descriptive statistics
    dataset_label: T1 Travel Times
    prompt: |
      A survey recorded the time to travel between two locations. Use the data
      in **B4:B58** to calculate the statistics below.
    steps:
      - kind: numeric
        ask: How many observations are in the data set?
        answer: 55
        tol: {abs: 0}
        verify: len(travel)
        solution:
          excel: "=COUNT(B4:B58)"
          r: "length(travel_time)"
          python: "len(df)"

      - kind: numeric
        ask: What is the mean travel time?
        answer: 22.58
        tol: {abs: 0.02}
        unit: minutes
        verify: float(travel.mean())
        traps:
          - value: 19
            feedback: |
              This is the **median**, not the mean. The two are different here.
              That difference is a sign the data is skewed.
          - value: 21.87
            feedback: |
              This is the mean without the outlier. Question 6 asks for that
              value. Here, use all 55 observations.
        solution:
          excel: "=AVERAGE(B4:B58)"
          r: "mean(travel_time)"
          python: "df.travel_time.mean()"

      - kind: numeric
        ask: What is the median travel time?
        answer: 19
        tol: {abs: 0.02}
        unit: minutes
        verify: float(np.median(travel))
        traps:
          - value: 22.58
            feedback: |
              This is the mean. The median is the middle value after sorting.
              With 55 values, it is the 28th.
        solution:
          excel: "=MEDIAN(B4:B58)"
          r: "median(travel_time)"
          python: "df.travel_time.median()"

      - kind: numeric
        ask: What is the mode?
        answer: 12
        tol: {abs: 0}
        unit: minutes
        verify: mode_sngl(travel)
        solution:
          excel: "=MODE.SNGL(B4:B58)"
          r: "as.numeric(names(sort(table(travel_time), decreasing = TRUE))[1])"
          python: "df.travel_time.mode()[0]"
          note: |
            `MODE` still works, but `MODE.SNGL` is the current name. Use
            `MODE.MULT` if two or more values share first place.
        on_correct: |
          The three averages differ: mean 22.58, median 19, mode 12. The mean is
          not always in the middle. Here, a few slow journeys pull it upwards.

      - kind: choice
        ask: Which function gives the standard deviation of this data?
        options:
          - value: STDEV.S
            correct: true
            feedback: |
              Correct. This survey is a sample of all journeys on the route, so
              the formula divides by n−1.
          - value: STDEV.P
            feedback: |
              `STDEV.P` treats the 55 values as every journey ever made on this
              route. A survey is a sample, so use `STDEV.S`.
          - value: STDEVA
            feedback: |
              `STDEVA` also counts text and TRUE/FALSE values as data. It gives
              the same answer on clean numbers. It will include any text your
              range picks up by mistake.
        hints:
          - Is this data the whole population, or a sample from it?

      - kind: numeric
        ask: What is the standard deviation?
        answer: 10.68
        also_accept: [10.67]
        tol: {abs: 0.02}
        unit: minutes
        verify: stdev_s(travel)
        traps:
          - value: 10.58
            feedback: |
              This is `STDEV.P`. It divides by n instead of n−1. The data is a
              sample, so use `STDEV.S`.
          - value: 113.99
            tol: {abs: 0.5}
            feedback: |
              This is the **variance**. The standard deviation is its square
              root. That is also why it is in minutes, not minutes squared.
          - value: 9.37
            feedback: |
              This is the standard deviation without the outlier. Question 6
              asks for that value.
        solution:
          excel: "=STDEV.S(B4:B58)"
          r: "sd(travel_time)"
          python: "df.travel_time.std()"
          note: |
            R's `sd()` and pandas' `.std()` divide by n−1, like `STDEV.S`.
            NumPy does not. `np.std(x)` divides by n, so use
            `np.std(x, ddof=1)`.
          working: |
            √113.99 = 10.6766. To 2 decimal places, this is 10.68. Some sources
            cut the digits instead of rounding and print 10.67. Either value is
            correct here.

      - kind: numeric
        ask: What is the variance?
        answer: 113.99
        tol: {abs: 0.05}
        verify: var_s(travel)
        traps:
          - value: 111.92
            feedback: |
              This is `VAR.P`, the population variance. Use `VAR.S` for a
              sample.
          - value: 10.68
            tol: {abs: 0.05}
            feedback: |
              This is the standard deviation. The variance is its square, in
              minutes squared.
        solution:
          excel: "=VAR.S(B4:B58)"
          r: "var(travel_time)"
          python: "df.travel_time.var()"

      - kind: numeric
        ask: What is the skewness?
        answer: 1.20
        tol: {abs: 0.03}
        verify: skew_excel(travel)
        traps:
          - value: 0.69
            feedback: |
              This is the skewness without the outlier. Question 6 asks for that
              value.
        solution:
          excel: "=SKEW(B4:B58)"
          r: "e1071::skewness(travel_time, type = 2)"
          python: "df.travel_time.skew()"
          note: |
            Do not use `SKEW.P`. That formula is for a complete population.

            In R, `e1071::skewness` needs `type = 2` to match Excel. In Python,
            pandas' `.skew()` already matches, but `scipy.stats.skew` needs
            `bias=False`.
        on_correct: |
          A positive skew means the data has a long tail on the right. A few
          slow journeys pull the mean above the median.

      - kind: table
        ask: Give the first, second and third quartiles.
        tol: {abs: 0.02}
        columns: ["1st quartile", "2nd quartile", "3rd quartile"]
        corner: "Travel time (min)"
        rows: ["Value"]
        cells:
          - {key: q1, row: 0, col: 0, answer: 14.5}
          - {key: q2, row: 0, col: 1, answer: 19}
          - {key: q3, row: 0, col: 2, answer: 30.5}
        verify: "[quartile_inc(travel, .25), quartile_inc(travel, .5), quartile_inc(travel, .75)]"
        solution:
          excel: "=QUARTILE.INC(B4:B58, 1)   then 2, then 3"
          r: "quantile(travel_time, c(.25, .5, .75), type = 7)"
          python: "df.travel_time.quantile([.25, .5, .75])"
          note: |
            `QUARTILE.INC(range, 4)` gives the maximum and `0` gives the
            minimum. R's `type = 7` and pandas both match Excel, so all three
            tools agree.
        on_correct: |
          The 2nd quartile is 19, the same as the median. They are the same
          measure.
    solution:
      working: |
        | Statistic | Value |
        |---|---|
        | Observations | 55 |
        | Mean | 22.58 |
        | Median | 19.00 |
        | Mode | 12 |
        | Standard deviation | 10.68 |
        | Variance | 113.99 |
        | Skewness | 1.20 |
        | Quartiles (1, 2, 3) | 14.50, 19.00, 30.50 |

  # ----------------------------------------------------------- Question 3
  - id: t1-q3
    title: Question 3 — Histogram
    dataset_label: T1 Histogram Guide
    prompt: |
      The counts are on the **T1 Histogram Guide** sheet. Draw a histogram of
      travel time using **relative frequency density** and a class width of 5.

      Add three columns to your sheet:

      - Relative frequency = count in bin ÷ total count
      - Relative frequency density = relative frequency ÷ class width
      - Cumulative relative frequency = running total of the relative frequencies

      Then complete the three rows below to check your columns.
    steps:
      - kind: table
        ask: Complete these three rows of your table.
        tol: {abs: 0.002}
        corner: "Bin"
        columns: ["Relative frequency", "Relative frequency density", "Cumulative relative frequency"]
        rows: ["(10,15]  count 16", "(25,30]  count 5", "(60,65]  count 1"]
        cells:
          - key: r0c0
            row: 0
            col: 0
            answer: 0.291
            traps:
              - value: 16
                tol: {abs: 0.5}
                feedback: |
                  This is the count. Divide it by the total number of
                  observations, 55.
          - key: r0c1
            row: 0
            col: 1
            answer: 0.058
            traps:
              - value: 0.291
                feedback: |
                  This is the relative frequency. Divide it by the class width,
                  5, to get the density.
          - {key: r0c2, row: 0, col: 2, answer: 0.291}
          - {key: r1c0, row: 1, col: 0, answer: 0.091}
          - {key: r1c1, row: 1, col: 1, answer: 0.018}
          - key: r1c2
            row: 1
            col: 2
            answer: 0.745
            traps:
              - value: 0.091
                feedback: |
                  Cumulative means the running total. Add every relative
                  frequency from the first bin up to this one.
          - {key: r2c0, row: 2, col: 0, answer: 0.018}
          - {key: r2c1, row: 2, col: 1, answer: 0.004}
          - key: r2c2
            row: 2
            col: 2
            answer: 1.000
            traps:
              - value: 0.982
                feedback: |
                  This is the final bin, so the total must reach exactly 1. Add
                  this bin's own relative frequency.
        col_feedback:
          1: |
            Every value in the density column is wrong. Divide the relative
            frequency by the **class width**, which is 5. This makes the *area*
            of each bar equal to the share of data in it.
          2: |
            Every value in the cumulative column is wrong. Add all relative
            frequencies up to and including that bin. The last value must be
            1.000.
        verify: |
          [0.291, 0.058, 0.291, 0.091, 0.018, 0.745, 0.018, 0.004, 1.000]
        hints:
          - There are 55 observations. Every class is 5 minutes wide.
          - The last cumulative value must be 1. Use it to check your column.

      - kind: choice
        ask: Which column do you plot to draw the histogram?
        options:
          - value: Relative frequency density
            correct: true
            feedback: |
              Correct. With density, the *area* of each bar equals the share of
              data in it. This stays true even if the classes have different
              widths.
          - value: Count
            feedback: |
              This gives a frequency histogram. The question asks for relative
              frequency density.
          - value: Cumulative relative frequency
            feedback: |
              This column is for the plot in Question 4.
          - value: Relative frequency
            feedback: |
              This has not been divided by the class width. The question asks
              for density.
    solution:
      working: |
        | Bin | Count | Rel. freq | Rel. freq density | Cumulative |
        |---|---|---|---|---|
        | (0,5] | 0 | 0.000 | 0.000 | 0.000 |
        | (5,10] | 0 | 0.000 | 0.000 | 0.000 |
        | (10,15] | 16 | 0.291 | 0.058 | 0.291 |
        | (15,20] | 16 | 0.291 | 0.058 | 0.582 |
        | (20,25] | 4 | 0.073 | 0.015 | 0.655 |
        | (25,30] | 5 | 0.091 | 0.018 | 0.745 |
        | (30,35] | 7 | 0.127 | 0.025 | 0.873 |
        | (35,40] | 4 | 0.073 | 0.015 | 0.945 |
        | (40,45] | 2 | 0.036 | 0.007 | 0.982 |
        | (45,50] | 0 | 0.000 | 0.000 | 0.982 |
        | (50,55] | 0 | 0.000 | 0.000 | 0.982 |
        | (55,60] | 0 | 0.000 | 0.000 | 0.982 |
        | (60,65] | 1 | 0.018 | 0.004 | 1.000 |

        **To plot the histogram in Excel:**

        1. Select the relative frequency density column.
        2. Hold Ctrl (Cmd on a Mac) and select the bin label column as well.
        3. Choose Insert → Column chart → 2-D column.
        4. Right-click a bar and choose **Format Data Series**.
        5. Set **Gap Width** to 0%, so the bars touch.

        Step 5 is what makes the chart a histogram rather than a bar chart.
      excel: "=B4/SUM($B$4:$B$16)   then  =C4/5   then  =SUM($C$4:C4)"
      r: |
        h <- hist(travel_time, breaks = seq(0, 65, 5), plot = FALSE)
        h$density                      # relative frequency density
        cumsum(h$counts) / sum(h$counts)
      python: |
        counts, edges = np.histogram(df.travel_time, bins=range(0, 70, 5))
        rel = counts / counts.sum()
        density, cumulative = rel / 5, rel.cumsum()
      note: |
        Excel has a built-in Histogram chart. It chooses the class boundaries
        for you. Building the table by hand gives you control over them.

  # ----------------------------------------------------------- Question 4
  - id: t1-q4
    title: Question 4 — Cumulative relative frequency plot
    prompt: |
      Draw a cumulative relative frequency plot of travel time, using a class
      width of 5. You already have the column from Question 3.
    steps:
      - kind: choice
        ask: What should the last point on this plot equal?
        options:
          - value: "1.000"
            correct: true
            feedback: |
              Correct. Use this to check your work. If the last point is not 1,
              a bin is missing.
          - value: "0.982"
            feedback: |
              This is the value at the (40,45] bin, before the outlier at 61 is
              added. The plot must reach 1.
          - value: "55"
            feedback: |
              This is the total count. These are relative frequencies, which are
              shares of the total, so the plot ends at 1.
          - value: "It depends on the data"
            feedback: |
              A cumulative relative frequency always ends at 1. By the last bin,
              100% of the observations are included.

      - kind: numeric
        ask: Reading from your plot, what share of journeys took 20 minutes or less?
        answer: 0.582
        tol: {abs: 0.02}
        verify: "0.582"
        traps:
          - value: 0.291
            feedback: |
              This is the value at 15 minutes. Read the value at the top edge of
              the (15,20] class.
          - value: 0.418
            feedback: |
              This is 1 − 0.582, the share taking *more* than 20 minutes. The
              plot is read from the left.
        hints:
          - Find 20 on the horizontal axis. Read the height of the curve there.
        solution:
          working: |
            The cumulative relative frequency at the top of the (15,20] class is
            0.582. About 58% of journeys took 20 minutes or less.

            A cumulative plot answers questions of the form "what share of
            journeys took under X minutes?" directly.
    solution:
      note: |
        Use the same steps as Question 3, but select the cumulative relative
        frequency column. Choose a line or scatter chart instead of columns.
        The values rise steadily, so joining the points is useful here.

  # ----------------------------------------------------------- Question 5
  - id: t1-q5
    title: Question 5 — Outliers
    prompt: |
      Use the histogram and the cumulative frequency plot to find the outliers.
      How many are there, and what are their values?
    steps:
      - kind: numeric
        ask: How many outliers are in the data set?
        answer: 1
        tol: {abs: 0}
        verify: "int(np.sum(travel > 45))"
        traps:
          - value: 0
            feedback: |
              Look at the right of the histogram. Three classes are empty, then
              one bar stands alone. That gap marks an outlier.
          - value: 2
            feedback: |
              Only one value sits beyond the gap. The values in the (40,45]
              class are high, but they follow on from the rest of the data.
        hints:
          - An outlier appears as a bar separated from the rest by empty classes.

      - kind: numeric
        ask: What is its value?
        answer: 61
        tol: {abs: 0}
        unit: minutes
        verify: float(travel.max())
        traps:
          - value: 42
            feedback: |
              42 is the largest value in the main group of data, but it is not
              separated from it. The outlier is in the (60,65] class.
        solution:
          excel: "=MAX(B4:B58)"
          r: "max(travel_time)"
          python: "df.travel_time.max()"

      - kind: choice
        ask: What should you do with the outlier?
        prose: true
        options:
          - value: Find out why it happened, then decide, and record your decision
            correct: true
            feedback: |
              Correct. The value may be a recording error. It may also be a real
              61-minute journey caused by an incident, which matters. Never
              remove a value without saying so.
          - value: Delete it, because outliers distort the statistics
            feedback: |
              Removing data because it changes your results gives a false
              picture of the road network. Find out why the value occurred
              first. If you remove it, record that you did and why.
          - value: Keep it, because removing data is never allowed
            feedback: |
              If the value came from a broken detector or a typing error, then
              keeping it reports something false. You need a reason for your
              decision, either way.
    solution:
      working: |
        There is one outlier. Its value is 61 minutes.

        Both plots show it. On the histogram it is a single bar in the (60,65]
        class, with three empty classes before it. On the cumulative plot the
        line is flat across those empty classes, then steps up to 1.

  # ----------------------------------------------------------- Question 6
  - id: t1-q6
    title: Question 6 — The effect of removing the outlier
    dataset_label: T1 Travel Times
    prompt: |
      Repeat Question 2 with the outlier removed. Then compare the two sets of
      results. One value out of 55 changes some statistics a lot and others
      very little.
    steps:
      - kind: numeric
        ask: Mean, with the outlier removed.
        answer: 21.87
        tol: {abs: 0.02}
        unit: minutes
        verify: float(travel_no_outlier.mean())
        hints:
          - |
            The data is in survey order, so the value 61 sits somewhere in the
            middle of the column. Copy the column to an empty part of the sheet
            and **sort the copy**. The outlier moves to the bottom, and the
            range above it is easy to select.
        solution:
          excel: "=AVERAGE(D4:D57) on a sorted copy, or =(SUM(B4:B58)-61)/54"
          r: "mean(travel_time[travel_time < 61])"
          python: "df.travel_time[df.travel_time < 61].mean()"
          note: |
            To sort a copy in Excel:

            1. Copy B4:B58 into column D.
            2. Select D4:D58.
            3. Choose **Data → Sort Smallest to Largest**.

            The value 61 moves to D58. The range D4:D57 is now the data without
            the outlier. Sort the copy and leave the original data unchanged.

      - kind: numeric
        ask: Standard deviation, with the outlier removed.
        answer: 9.37
        tol: {abs: 0.02}
        unit: minutes
        verify: stdev_s(travel_no_outlier)
        traps:
          - value: 10.68
            feedback: |
              This is the full data set. Check that your range leaves out the
              value 61.
        solution:
          excel: "=STDEV.S(D4:D57) on the sorted copy"
          r: "sd(travel_time[travel_time < 61])"
          python: "df.travel_time[df.travel_time < 61].std()"

      - kind: numeric
        ask: Skewness, with the outlier removed.
        answer: 0.70
        also_accept: [0.69]
        tol: {abs: 0.03}
        verify: skew_excel(travel_no_outlier)
        solution:
          excel: "=SKEW(D4:D57) on the sorted copy"
          r: "e1071::skewness(travel_time[travel_time < 61], type = 2)"
          python: "df.travel_time[df.travel_time < 61].skew()"

      - kind: choice
        ask: Which statistic changed *most* when the outlier was removed?
        options:
          - value: Variance
            correct: true
            feedback: |
              Correct. It fell from 113.99 to 87.78, a drop of about 23%. The
              variance squares the distance of each value from the mean. The
              outlier is 38 minutes above the mean, so it adds a very large
              amount. Measures of spread react far more strongly to extreme
              values than measures of centre.
          - value: Mean
            feedback: |
              The mean changed by 0.71 minutes, about 3%. Another statistic
              changed much more. Look at the measures of spread.
          - value: Median
            feedback: |
              The median changed from 19 to 18.5. It reacts very little to
              extreme values. Look at the measures of spread.
          - value: Mode
            feedback: |
              The mode did not change. It is still 12. Removing one extreme
              value cannot change which value appears most often.

      - kind: freetext
        ask: |
          In two or three sentences, explain what this comparison shows about
          handling outliers. Write it for a colleague who does not use
          statistics.
        min_length: 80
        rubric:
          - Says which statistics changed a lot (variance, standard deviation, skew) and which changed very little (mode, median, mean).
          - Explains why. Squaring the distances means extreme values dominate the measures of spread.
          - States the practical result. Check data for outliers before summarising it.
          - Uses plain language, with no unexplained terms.
        solution:
          working: |
            **Model answer.** Removing one slow journey barely changed the
            typical travel time. The mean fell by 0.7 minutes and the median by
            half a minute. It changed the picture of how much journeys vary far
            more, cutting the variance by almost a quarter and nearly halving
            the skew. This happens because the measures of spread square the
            distance of each value from the mean, so one extreme value counts
            for much more than an ordinary one. The practical result is that you
            must check data for outliers before you summarise it. A standard
            deviation quoted without that check can give a very misleading
            picture of how reliable a journey time is.
