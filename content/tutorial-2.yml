tutorial: 2
title: Parametric Distributions and Probability Modelling

intro: |
  Excel calculates these probabilities in one line. The difficult part is
  choosing the right distribution, then rewriting the probability you want into
  a form the function can calculate.

learning_outcomes:
  - Determine and visualise probability intervals on the normal distribution.
  - Apply the probability-interval method using the normal distribution (NORM.DIST, NORM.INV).
  - Apply it using the binomial distribution (BINOM.DIST).
  - Apply it using the Poisson distribution (POISSON.DIST).

supplementary: |
  ![The five steps of the probability interval method](assets/img/method-probability.svg)

  Two ideas are used throughout this tutorial.

  **A probability is an area.** The probability that a value falls between two
  limits is the area under the curve between them. The total area is 1, because
  every possible value lies somewhere under the curve.

  **Excel measures area from the left.** `NORM.DIST`, and the cumulative forms
  of `BINOM.DIST` and `POISSON.DIST`, all return the area from the far left up
  to your value. If a question asks for a different area, rewrite it using:

  P(X > c) = 1 − P(X ≤ c)

  The [reference page](reference.html) lists the functions and the area each
  one returns. The [symbols glossary](reference.html#symbols) explains the
  notation.

questions:

  # ----------------------------------------------------------- Question 1
  - id: t2-q1
    title: Question 1 — Visualising probability intervals
    prompt: |
      X is a normal distribution with mean 0 and standard deviation 1. For each
      statement below, sketch the curve on paper and shade the area described.
      Then choose the diagram that matches your sketch.
    steps:
      - kind: sketch
        ask: "**1 − P(X > c)**, where c may be any number."
        options:
          - caption: Area to the left of c
            correct: true
            svg: '<img src="assets/img/normal-left-tail.svg" alt="Normal curve with the area to the left of c shaded">'
          - caption: Area to the right of c
            svg: '<img src="assets/img/normal-right-tail.svg" alt="Normal curve with the area to the right of c shaded">'
            feedback: |
              This is P(X > c). The statement asks for **1 minus** this. That
              leaves everything except the right area, which is the area to the
              left of c.
          - caption: Both outer tails
            svg: '<img src="assets/img/normal-two-tails.svg" alt="Normal curve with both outer tails shaded">'
            feedback: |
              The statement has one limit, c. Two shaded tails need two limits.
          - caption: The area between two points
            svg: '<img src="assets/img/normal-middle.svg" alt="Normal curve with the area between a and b shaded">'
            feedback: |
              An area between two values needs two limits. This statement has
              only c.
        solution:
          working: |
            The total area under the curve is 1. Removing the area to the right
            of c leaves the area to the left of c:

            **1 − P(X > c) = P(X ≤ c)**

            Excel returns left-hand areas. Use this rule whenever a question
            asks for a right-hand area.

      - kind: sketch
        ask: "**P(X < −c) = P(X > c)**, where c > 0."
        options:
          - caption: Both outer tails
            correct: true
            svg: '<img src="assets/img/normal-two-tails.svg" alt="Normal curve with both outer tails shaded">'
          - caption: Area to the left of c
            svg: '<img src="assets/img/normal-left-tail.svg" alt="Normal curve with the area to the left of c shaded">'
            feedback: |
              The statement names two points, −c and c. It says the areas beyond
              them are equal, so both areas must be shaded.
          - caption: The area between two points
            svg: '<img src="assets/img/normal-middle.svg" alt="Normal curve with the area between a and b shaded">'
            feedback: |
              This is the area *between* −c and c. The statement is about the
              areas *beyond* them.
          - caption: Area to the right of c
            svg: '<img src="assets/img/normal-right-tail.svg" alt="Normal curve with the area to the right of c shaded">'
            feedback: |
              This is P(X > c) only. The statement also describes P(X < −c), so
              shade both tails.
        solution:
          working: |
            The two tails are mirror images, because the normal distribution is
            symmetric about its mean.

            This is why a two-tailed test with α = 0.05 puts 0.025 in each tail,
            and why the critical value is 1.96 rather than 1.645. The same
            picture returns in Tutorials 3 and 4.

      - kind: sketch
        ask: "**P(a < X < b)**, where a < b."
        options:
          - caption: The area between a and b
            correct: true
            svg: '<img src="assets/img/normal-middle.svg" alt="Normal curve with the area between a and b shaded">'
          - caption: Both outer tails
            svg: '<img src="assets/img/normal-two-tails.svg" alt="Normal curve with both outer tails shaded">'
            feedback: |
              This is the area *outside* the two limits. The statement asks for
              the area between them.
          - caption: Area to the left of c
            svg: '<img src="assets/img/normal-left-tail.svg" alt="Normal curve with the area to the left of c shaded">'
            feedback: |
              A single left area has one limit. This statement has two.
          - caption: Area to the right of c
            svg: '<img src="assets/img/normal-right-tail.svg" alt="Normal curve with the area to the right of c shaded">'
            feedback: |
              A single right area has one limit. This statement has two.
        solution:
          working: |
            Take the area up to b, then subtract the area up to a:

            **P(a < X < b) = P(X < b) − P(X < a)**

            In Excel:
            `=NORM.DIST(b, mean, sd, TRUE) - NORM.DIST(a, mean, sd, TRUE)`
    solution:
      note: |
        Your sketch does not need to be accurate. It needs to show the correct
        area, so you can turn that area into a subtraction Excel can calculate.

  # ----------------------------------------------------------- Question 2
  - id: t2-q2
    title: Question 2 — The normal distribution
    prompt: |
      The time to walk between Leeds train station and the University of Leeds
      campus follows a normal distribution. The **mean is 25 minutes** and the
      **standard deviation is 12 minutes**. One traveller took exactly 15
      minutes.
    steps:
      - kind: numeric
        ask: How many standard deviations from the mean is the 15-minute journey?
        answer: -0.833
        also_accept: [0.833]
        tol: {abs: 0.01}
        verify: (15 - 25) / 12
        traps:
          - value: 10
            feedback: |
              This is the difference in minutes, 25 − 15. Divide it by the
              standard deviation to convert it into standard deviations.
          - value: -1.2
            tol: {abs: 0.01}
            feedback: |
              You have divided 12 by 10. The z-score is
              (value − mean) ÷ standard deviation, so divide 10 by 12.
        hints:
          - "z = (value − mean) ÷ standard deviation."
        solution:
          working: |
            z = (15 − 25) ÷ 12 = −0.833

            The journey is 0.833 standard deviations **below** the mean. Keep
            the minus sign. It shows the traveller was faster than average.
          excel: "=(15-25)/12    or  =STANDARDIZE(15,25,12)"
          r: "(15 - 25) / 12"
          python: "(15 - 25) / 12"

      - kind: choice
        ask: Which function gives the probability of a journey taking less than 15 minutes?
        options:
          - value: NORM.DIST
            correct: true
            feedback: |
              Correct. You have a value and want a probability. `NORM.DIST`
              works in that direction.
          - value: NORM.INV
            feedback: |
              `NORM.INV` works the other way. You give it a probability and it
              returns a value. Here you have the value, 15, and want the
              probability.
          - value: NORM.S.DIST
            feedback: |
              `NORM.S.DIST` works on the standard normal, with mean 0 and
              standard deviation 1. You could use it with the z-score of −0.833.
              `NORM.DIST` accepts the real mean and standard deviation, so there
              is less to go wrong.
          - value: STANDARDIZE
            feedback: |
              `STANDARDIZE` converts a value into a z-score. It does not return
              a probability.
        hints:
          - Are you going from a value to a probability, or from a probability to a value?

      - kind: numeric
        ask: What is the probability that a randomly selected person makes the journey in less than 15 minutes?
        answer: 0.2023
        tol: {abs: 0.002}
        verify: NORM_DIST(15, 25, 12, True)
        traps:
          - value: 0.798
            tol: {abs: 0.002}
            feedback: |
              This is the probability of taking **more** than 15 minutes. The
              question asks for less than 15. That is the left area, so no
              rearranging is needed.
          - value: 0.0332
            tol: {abs: 0.002}
            feedback: |
              This is the height of the curve, not the area. Set the last
              argument of `NORM.DIST` to `TRUE`.
        solution:
          working: |
            The interval is P(X < 15). Excel measures from the left, so no
            rearranging is needed.

            `=NORM.DIST(15, 25, 12, TRUE)` = 0.2023

            About 20% of journeys take less than 15 minutes. This traveller was
            faster than about 80% of people on the same route.
          excel: "=NORM.DIST(15,25,12,TRUE)"
          r: "pnorm(15, mean = 25, sd = 12)"
          python: "scipy.stats.norm.cdf(15, 25, 12)"
          note: |
            The fourth argument of `NORM.DIST` is the cumulative flag. `TRUE`
            gives the area up to your value, which is what you normally want.
            `FALSE` gives the height of the curve at that point.

      - kind: numeric
        ask: What is the lowest travel time that would still put a traveller in the slowest 5% of journeys?
        answer: 44.74
        also_accept: [44.73]
        tol: {abs: 0.02}
        unit: minutes
        verify: NORM_INV(0.95, 25, 12)
        traps:
          - value: 5.26
            tol: {abs: 0.05}
            feedback: |
              You have used 0.05. Excel measures from the left. The slowest 5%
              sits at the top of the distribution, above the 95% point, so use
              0.95.
          - value: 1.645
            tol: {abs: 0.01}
            feedback: |
              This is the z-score for the 95% point of the standard normal.
              Convert it into minutes: 25 + 1.645 × 12.
        hints:
          - You have a probability and want a value, so use the inverse function.
          - "\"Slowest 5%\" is the top 5%. Rewrite P(X ≥ T) = 0.05 as P(X < T) = 0.95."
        solution:
          working: |
            You need the travel time T where P(X ≥ T) = 0.05.

            Excel measures from the left, so rewrite it. The total area is 1:

            P(X < T) = 1 − 0.05 = 0.95

            `=NORM.INV(0.95, 25, 12)` = 44.74 minutes

            A journey of 44.74 minutes is slower than 95% of all journeys.
          excel: "=NORM.INV(0.95,25,12)"
          r: "qnorm(0.95, mean = 25, sd = 12)"
          python: "scipy.stats.norm.ppf(0.95, 25, 12)"
          note: |
            The exact value is 44.7382, which rounds to 44.74. Some sources cut
            the digits instead of rounding and print 44.73. Either value is
            correct here.

  # ----------------------------------------------------------- Question 3
  - id: t2-q3
    title: Question 3 — The binomial distribution
    prompt: |
      A researcher asks train passengers whether they hold a season ticket. The
      rail company says **14%** of passengers have one. There are **85
      passengers** on the train.

      Use the binomial distribution when you have a fixed number of independent
      trials, and each trial has the same probability of success.
    steps:
      - kind: numeric
        ask: How many combinations of outcomes are possible if the researcher asks everyone on the train?
        answer: 3.87e+25
        tol: {rel: 0.02}
        placeholder: e.g. 1.23e45
        verify: 2 ** 85
        hints:
          - Each passenger answers yes or no, independently of the others.
          - With 2 answers each and 85 passengers, multiply 2 by itself 85 times.
        solution:
          working: |
            Each of the 85 passengers answers yes or no. The number of possible
            outcomes is 2⁸⁵, which is about 3.87 × 10²⁵.

            That number is too large to list case by case. `BINOM.DIST`
            calculates the probability you need without listing them.
          excel: "=2^85    or  =1+SUMPRODUCT(COMBIN(85,ROW(INDIRECT(\"1:85\"))))"
          r: "2^85"
          python: "2**85"
          note: |
            You can also add up `COMBIN(85, k)` for every k from 0 to 85. Each
            term counts the ways to get exactly k season-ticket holders. The
            total is 2⁸⁵, so `=2^85` gives the same answer.

      - kind: numeric
        ask: What is the probability that fewer than 10 people on the train have a season ticket?
        answer: 0.2316
        tol: {abs: 0.002}
        verify: BINOM_DIST(9, 85, 0.14, True)
        traps:
          - value: 0.3216
            tol: {abs: 0.003}
            feedback: |
              You have used 10, which gives P(X ≤ 10). "Fewer than 10" does not
              include 10, so use 9.
          - value: 0.0459
            tol: {abs: 0.003}
            feedback: |
              This is P(X = 9), with the cumulative flag set to `FALSE`. "Fewer
              than 10" covers 0 to 9, so set the flag to `TRUE`.
        hints:
          - "\"Fewer than 10\" means 9 or fewer. Which number goes into the function?"
        solution:
          working: |
            The interval is P(X < 10). The count is a whole number, so this is
            the same as P(X ≤ 9).

            `=BINOM.DIST(9, 85, 0.14, TRUE)` = 0.2316

            Take care with this boundary. For continuous data, P(X < 10) and
            P(X ≤ 10) are the same. For counts they are not, because 10 has a
            probability of its own.
          excel: "=BINOM.DIST(9,85,0.14,TRUE)"
          r: "pbinom(9, size = 85, prob = 0.14)"
          python: "scipy.stats.binom.cdf(9, 85, 0.14)"

      - kind: numeric
        ask: What is the probability that more than 15 people on the train have a season ticket?
        answer: 0.132
        tol: {abs: 0.003}
        verify: 1 - BINOM_DIST(15, 85, 0.14, True)
        traps:
          - value: 0.868
            tol: {abs: 0.003}
            feedback: |
              This is P(X ≤ 15). The question asks for *more* than 15, so
              subtract this from 1.
          - value: 0.0776
            tol: {abs: 0.004}
            feedback: |
              You have used 1 − P(X ≤ 14), which is P(X ≥ 15). "More than 15"
              does not include 15, so use 1 − P(X ≤ 15).
        hints:
          - Excel measures from the left. Write this as 1 minus something.
          - "P(X > 15) = 1 − P(X ≤ 15)."
        solution:
          working: |
            Rewrite the interval so Excel can calculate it:

            P(X > 15) = 1 − P(X ≤ 15)

            `=1-BINOM.DIST(15, 85, 0.14, TRUE)`

            P(X ≤ 15) = 0.868, so P(X > 15) = **0.132**.
          excel: "=1-BINOM.DIST(15,85,0.14,TRUE)"
          r: "pbinom(15, 85, 0.14, lower.tail = FALSE)"
          python: "scipy.stats.binom.sf(15, 85, 0.14)"
          note: |
            R and Python can return the upper area directly, with
            `lower.tail = FALSE` and `.sf()`. Excel has no equivalent for the
            binomial, so you must subtract from 1.

      - kind: numeric
        ask: What is the probability that exactly 8 people on the train have a season ticket?
        answer: 0.0642
        tol: {abs: 0.001}
        verify: BINOM_DIST(8, 85, 0.14, False)
        traps:
          - value: 0.1379
            tol: {abs: 0.003}
            feedback: |
              This is P(X ≤ 8), the cumulative probability. "Exactly" means one
              value only, so set the cumulative flag to `FALSE`.
        hints:
          - The word "exactly" decides the cumulative flag.
        solution:
          working: |
            `=BINOM.DIST(8, 85, 0.14, FALSE)` = 0.0642

            There is a 6.4% chance of finding exactly 8 season-ticket holders.

            With the flag set to `FALSE`, the function returns the probability
            of that one outcome instead of everything up to it.
          excel: "=BINOM.DIST(8,85,0.14,FALSE)"
          r: "dbinom(8, 85, 0.14)"
          python: "scipy.stats.binom.pmf(8, 85, 0.14)"
          note: |
            In R and Python, the `d` prefix gives one outcome and the `p` prefix
            gives the cumulative total. Excel uses the `TRUE`/`FALSE` flag for
            the same purpose.

  # ----------------------------------------------------------- Question 4
  - id: t2-q4
    title: Question 4 — The Poisson distribution
    prompt: |
      The Poisson distribution counts events in a fixed period of time or
      space, when you know the average rate.

      The binomial has a fixed number of trials. The Poisson does not. There is
      no upper limit on how many cars can pass a detector in an hour.
    steps:
      - kind: numeric
        ask: |
          Applications for a new position at ITS arrive at an average of 3 per
          hour. What is the probability of receiving exactly 1 application in
          the next hour?
        answer: 0.1494
        tol: {abs: 0.002}
        verify: POISSON_DIST(1, 3, False)
        traps:
          - value: 0.1991
            tol: {abs: 0.002}
            feedback: |
              This is P(X ≤ 1), the probability of one or fewer. "Exactly 1"
              needs the cumulative flag set to `FALSE`.
        solution:
          working: |
            `=POISSON.DIST(1, 3, FALSE)` = 0.1494

            The arguments are (value, mean, cumulative). The question says
            "exactly", so the cumulative flag is `FALSE`.
          excel: "=POISSON.DIST(1,3,FALSE)"
          r: "dpois(1, lambda = 3)"
          python: "scipy.stats.poisson.pmf(1, 3)"

      - kind: numeric
        ask: |
          Cars pass a detector at an average of 7 per hour. What is the
          probability of seeing more than 10 cars in the next hour?
        answer: 0.0985
        tol: {abs: 0.002}
        verify: 1 - POISSON_DIST(10, 7, True)
        traps:
          - value: 0.9015
            tol: {abs: 0.002}
            feedback: |
              This is P(X ≤ 10). The question asks for *more* than 10, so
              subtract this from 1.
          - value: 0.1420
            tol: {abs: 0.003}
            feedback: |
              You have used 1 − P(X ≤ 9), which is P(X ≥ 10). "More than 10"
              does not include 10, so keep the argument at 10.
        solution:
          working: |
            P(X > 10) = 1 − P(X ≤ 10)

            `=1-POISSON.DIST(10, 7, TRUE)` = 0.0985

            When the average is 7 per hour, there is just under a 10% chance of
            seeing more than 10 cars.
          excel: "=1-POISSON.DIST(10,7,TRUE)"
          r: "ppois(10, 7, lower.tail = FALSE)"
          python: "scipy.stats.poisson.sf(10, 7)"

      - kind: numeric
        ask: |
          A help centre receives an average of 4 calls per minute. What is the
          maximum number of calls in a minute that you would expect 95% of the
          time?
        answer: 7
        also_accept: [8]
        tol: {abs: 0}
        unit: calls
        verify: 7
        traps:
          - value: 4
            feedback: |
              This is the average rate. You need the count n where the
              cumulative probability first reaches about 95%.
          - value: 6
            feedback: |
              P(X ≤ 6) = 0.889, which is below 95%. Try the next value.
        hints:
          - Excel has no inverse Poisson function. Increase n one step at a time.
          - "Calculate POISSON.DIST(n, 4, TRUE) for n = 0, 1, 2 and so on. Watch for the value that passes 0.95."
        solution:
          working: |
            Excel has no inverse Poisson function, so build a short table:

            | n | P(X ≤ n) |
            |---|---|
            | 6 | 0.8893 |
            | 7 | 0.9489 |
            | 8 | 0.9786 |

            Two answers are possible, because the wording can be read two ways.
            P(X ≤ 7) = 94.89%, just below 95%. P(X ≤ 8) = 97.86%, above 95%.

            - The largest n that stays within 95% is **7**.
            - The smallest n that reaches at least 95% is **8**.

            Either value is correct here. To plan staff for a call centre you
            would choose 8, because you need to cover at least 95% of minutes.
            The exact wording of a specification changes the answer.
          excel: "=POISSON.DIST(7,4,TRUE)   then try 8, and so on"
          r: "qpois(0.95, lambda = 4)    # returns 8"
          python: "scipy.stats.poisson.ppf(0.95, 4)   # returns 8.0"
          note: |
            R and Python have an inverse Poisson: `qpois` and `.ppf`. Both
            return **8**, because they use the "at least 95%" rule. This is why
            an answer from R may differ from an answer from Excel.
